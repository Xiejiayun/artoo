name: Preview gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_desktop:
        description: Run installed Windows smoke on an operator-managed interactive runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    if: always()
    needs: [shared-checks, shared-vitest, shared-windows-process]
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Require every shared partition
        env:
          SHARED_CHECKS_RESULT: ${{ needs.shared-checks.result }}
          SHARED_VITEST_RESULT: ${{ needs.shared-vitest.result }}
          WINDOWS_PROCESS_RESULT: ${{ needs.shared-windows-process.result }}
        run: |
          if ($env:SHARED_CHECKS_RESULT -ne 'success' -or $env:SHARED_VITEST_RESULT -ne 'success' -or $env:WINDOWS_PROCESS_RESULT -ne 'success') {
            throw "Shared checks=$env:SHARED_CHECKS_RESULT; Vitest shards=$env:SHARED_VITEST_RESULT; Windows process=$env:WINDOWS_PROCESS_RESULT"
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-*
          path: artifacts/preview-gate/vitest
      - name: Require actual Vitest file coverage without omissions or overlap
        run: node scripts/ci-vitest-coverage.mjs verify artifacts/preview-gate/vitest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: artifacts/preview-gate/vitest/coverage.json
          if-no-files-found: ignore
          retention-days: 14
  shared-vitest:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      ARTOO_CI_TEST_PARTITION: parallel
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm run build:preview
      - run: node scripts/ci-vitest-coverage.mjs record parallel-${{ matrix.shard }} artifacts/preview-gate/vitest
      # list --filesOnly records discovery, not Vitest's shard allocation. The
      # aggregate checks actual JSON reporter sets from both executed shards.
      - run: npx vitest list --config vitest.ci.config.mjs --filesOnly --json=artifacts/preview-gate/vitest/discovery.json
      - run: npm test -- --config vitest.ci.config.mjs --maxWorkers=2 --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile.json=artifacts/preview-gate/vitest/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-parallel-${{ matrix.shard }}
          path: artifacts/preview-gate/vitest/*.json
          if-no-files-found: error
          retention-days: 14
  shared-windows-process:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      ARTOO_CI_TEST_PARTITION: windows-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - run: node scripts/ci-vitest-coverage.mjs record windows-process artifacts/preview-gate/vitest
      - run: npx vitest list --filesOnly --json=artifacts/preview-gate/vitest/full-discovery.json
      - run: npx vitest list --config vitest.ci.config.mjs --filesOnly --json=artifacts/preview-gate/vitest/discovery.json
      # Dedicated runner and one file at a time; original per-case deadlines,
      # assertions and platform guards remain in the four complete test files.
      - run: npm test -- --config vitest.ci.config.mjs --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile.json=artifacts/preview-gate/vitest/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-windows-process
          path: artifacts/preview-gate/vitest/*.json
          if-no-files-found: error
          retention-days: 14
  shared-checks:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm run verify:preview -- --suite=shared-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-gate-results
          path: |
            artifacts/preview-gate/*.json
            apps/web/test-results/
            apps/web/test-results-auth/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  ios:
    runs-on: macos-15
    # Five independent UI suites, 45-minute core and 60-minute correction budgets, and cold builds.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release SDK requirements
        run: node apps/ios/scripts/release-toolchain.mjs
      - name: Verify distribution signing contracts
        run: node --test apps/ios/scripts/archive-device.test.mjs apps/ios/scripts/archive-distribution.test.mjs apps/ios/scripts/release-toolchain.test.mjs apps/ios/scripts/release-ui.test.mjs
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Ensure XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: npm run verify:ios
      - name: Verify publisher links on iPhone and iPad
        run: npm run verify:ios:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xctest-results
          path: |
            artifacts/preview-gate/*.json
            artifacts/ios/*.json
            artifacts/ios/*.png
            artifacts/ios/*.html
            artifacts/ios/attempts/*/*.json
            artifacts/ios/attempts/*/*.html
            artifacts/ios/attempts/*/*.png
            artifacts/ios/attempts/*/diagnostics/*.json
            artifacts/ios/attempts/*/correction-evidence/
            artifacts/ios/attempts/*/retention-evidence/
            artifacts/ios/release-ui-*/*.html
            artifacts/ios/release-ui-*/*.json
            artifacts/ios/release-ui-*/*.log
            artifacts/ios/release-ui-*/devices/*/*.json
            artifacts/ios/release-ui-*/devices/*/ui-attachments/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-failed-ui-attachments
          path: |
            artifacts/ios/attempts/*/ui-attachments/manifest.json
            artifacts/ios/attempts/*/ui-attachments/*.png
            artifacts/ios/attempts/*/ui-attachments/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-failed-xcresult-diagnostics
          path: artifacts/ios/attempts/*/*.xcresult/
          if-no-files-found: ignore
          retention-days: 7
  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Mac DMG installation E2E
        shell: bash
        run: |
          mkdir -p artifacts/preview-gate
          npm run verify:mac 2>&1 | tee artifacts/preview-gate/mac-dmg.log
      - run: npm run verify:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-packaged-e2e
          path: |
            artifacts/preview-gate/*.json
            artifacts/preview-gate/mac-dmg.log
            apps/desktop/release/mac-smoke-artifacts/
            apps/desktop/release/mac-dmg-smoke-artifacts/
            apps/desktop/release/mac-distribution/*/distribution.json
            apps/desktop/release/mac-distribution/*/builder-debug.yml
            apps/desktop/release/mac-distribution/*/*.log
            artifacts/recovery/
          if-no-files-found: ignore
          retention-days: 14
  windows-desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_desktop
    # Configure an isolated, logged-in runner with this label. Do not run PR code
    # on a personal workstation or run the runner as a noninteractive service.
    runs-on: [self-hosted, Windows, X64, artoo-desktop]
    timeout-minutes: 45
    env:
      ARTOO_DESKTOP_INTERACTIVE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm run verify:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-smoke
          path: |
            artifacts/preview-gate/*.json
            apps/desktop/release/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
