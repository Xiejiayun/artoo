name: Pairing precheck diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correction:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: npm run build:preview
      - run: node apps/ios/scripts/test-macos.mjs
      - run: node scripts/ios-ui-correction-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-correction-diagnostic
          path: artifacts/ios
          retention-days: 7
