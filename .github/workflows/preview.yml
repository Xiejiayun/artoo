name: Preview gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_desktop:
        description: Run installed Windows smoke on an operator-managed interactive runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm run verify:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-gate-results
          path: |
            artifacts/preview-gate/*.json
            apps/web/test-results/
            apps/web/test-results-auth/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
  ios:
    runs-on: macos-15
    # Five independent UI suites, 45-minute core and 60-minute correction budgets, and cold builds.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release SDK requirements
        run: node apps/ios/scripts/release-toolchain.mjs
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Ensure XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: npm run verify:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-xctest-results
          path: |
            artifacts/preview-gate/*.json
            artifacts/ios/*.json
            artifacts/ios/*.png
            artifacts/ios/*.html
            artifacts/ios/attempts/*/*.json
            artifacts/ios/attempts/*/*.html
            artifacts/ios/attempts/*/*.png
            artifacts/ios/attempts/*/diagnostics/*.json
            artifacts/ios/attempts/*/correction-evidence/
            artifacts/ios/attempts/*/retention-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-failed-ui-attachments
          path: |
            artifacts/ios/attempts/*/ui-attachments/manifest.json
            artifacts/ios/attempts/*/ui-attachments/*.png
            artifacts/ios/attempts/*/ui-attachments/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-failed-xcresult-diagnostics
          path: artifacts/ios/attempts/*/*.xcresult/
          if-no-files-found: ignore
          retention-days: 7
  mac-desktop:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - name: Mac DMG installation E2E
        shell: bash
        run: |
          mkdir -p artifacts/preview-gate
          npm run verify:mac 2>&1 | tee artifacts/preview-gate/mac-dmg.log
      - run: npm run verify:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-packaged-e2e
          path: |
            artifacts/preview-gate/*.json
            artifacts/preview-gate/mac-dmg.log
            apps/desktop/release/mac-smoke-artifacts/
            apps/desktop/release/mac-dmg-smoke-artifacts/
            apps/desktop/release/mac-distribution/*/distribution.json
            apps/desktop/release/mac-distribution/*/builder-debug.yml
            apps/desktop/release/mac-distribution/*/*.log
            artifacts/recovery/
          if-no-files-found: ignore
          retention-days: 14
  windows-desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_desktop
    # Configure an isolated, logged-in runner with this label. Do not run PR code
    # on a personal workstation or run the runner as a noninteractive service.
    runs-on: [self-hosted, Windows, X64, artoo-desktop]
    timeout-minutes: 45
    env:
      ARTOO_DESKTOP_INTERACTIVE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npm run verify:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-smoke
          path: |
            artifacts/preview-gate/*.json
            apps/desktop/release/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
