name: Verify Web daemon distribution availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/azure-release/daemon-registry.test.mjs
      - name: Verify the exact Web-pinned public npm bytes against the qualified release
        env:
          DAEMON_REGISTRY_EVIDENCE: artifacts/daemon-registry.json
        run: node scripts/azure-release/daemon-registry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/daemon-registry.json
          if-no-files-found: ignore
