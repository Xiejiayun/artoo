name: Publisher privacy and support
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publisher-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publisher-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish policy and support pages
        id: deployment
        uses: actions/deploy-pages@v4
