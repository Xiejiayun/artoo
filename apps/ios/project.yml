# XcodeGen project spec for the artoo iOS app.
#
# This repo is developed on Windows where Xcode cannot run, so the Xcode project
# is defined declaratively here instead of committing a hand-written .xcodeproj.
# On macOS:
#
#   brew install xcodegen
#   cd apps/ios
#   xcodegen generate        # writes Artoo.xcodeproj from this spec
#   open Artoo.xcodeproj      # build/run in the iOS Simulator
#   # or: xcodebuild -scheme Artoo -destination 'platform=iOS Simulator,name=iPhone 15' test
#
# Verification boundary: this revision was authored on Windows. Xcode build,
# XCTest, full assets and device/server flows require Mac verification.
# See README.md; earlier source-build evidence does not verify this revision.

name: Artoo
options:
  bundleIdPrefix: dev.artoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Artoo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Artoo
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connect to your team's local Artoo server.
        # Opt-in onboarding permits localhost/.local HTTP for development only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artoo.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        # Simulator-only ad-hoc identity enables the real Keychain API in XCTest.
        # Device/TestFlight provisioning remains owned by the Apple developer team.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Configuration/Simulator.entitlements

  ArtooTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Artoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artoo.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Artoo:
    build:
      targets:
        Artoo: all
        ArtooTests: [test]
    test:
      targets:
        - ArtooTests
