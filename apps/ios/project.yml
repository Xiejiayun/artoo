# XcodeGen project spec for the artoo iOS app.
#
# This repo is developed on Windows where Xcode cannot run, so the Xcode project
# is defined declaratively here instead of committing a hand-written .xcodeproj.
# On macOS:
#
#   brew install xcodegen
#   cd apps/ios
#   xcodegen generate        # writes Artoo.xcodeproj from this spec
#   open Artoo.xcodeproj      # build/run in the iOS Simulator
#   # or: xcodebuild -scheme Artoo -destination 'platform=iOS Simulator,name=iPhone 15' test
#
# Verification boundary: XcodeGen generation and generic iOS no-assets
# build-for-testing have passed on macOS. Full asset-catalog build,
# simulator/device runtime, and executed tests remain blocked/unverified.
# See README.md.

name: Artoo
options:
  bundleIdPrefix: dev.artoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Artoo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Artoo
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dev convenience: allow plain-http to a local server (default config
        # talks to the in-memory mock, so this only matters when useMock=false).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artoo.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"

  ArtooTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Artoo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artoo.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Artoo:
    build:
      targets:
        Artoo: all
        ArtooTests: [test]
    test:
      targets:
        - ArtooTests
