<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artoo — Linear 风格全闭环项目工作台 (终版)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body[data-theme="dark"] {
      --background: #0b0d12;
      --sidebar: #101218;
      --content: #141720;
      --card: #171b26;
      --border: #252a38;
      --card-border: #202532;
      --foreground: #eef1f6;
      --muted-foreground: #8c96a8;
      --placeholder: #626c7d;
      --code-foreground: #d8e0ec;
      --primary: #6c77f5;
      --primary-foreground: #ffffff;
      --secondary: #1b202d;
      --secondary-foreground: #e5e9f2;
      --accent: #6c77f5;
      --link: #8b95ff;
      --success: #34d399;
      --warning: #f59e0b;
      --error: #f87171;
      --chart-1: #818cf8;
      --chart-2: #34d399;
      --chart-3: #f59e0b;
    }
    body[data-theme="light"] {
      --background: #ffffff;
      --sidebar: #f7f8fa;
      --content: #f5f6f8;
      --card: #ffffff;
      --border: #e2e6ed;
      --card-border: #eceff4;
      --foreground: #14171f;
      --muted-foreground: #5c6675;
      --placeholder: #8a94a4;
      --code-foreground: #232833;
      --primary: #4f46e5;
      --primary-foreground: #ffffff;
      --secondary: #f1f3f6;
      --secondary-foreground: #1d222b;
      --accent: #4f46e5;
      --link: #4f46e5;
      --success: #15803d;
      --warning: #b45309;
      --error: #c62828;
      --chart-1: #4f46e5;
      --chart-2: #0d9488;
      --chart-3: #b45309;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--foreground);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: -0.005em;
      overflow-x: hidden;
    }
    .ln-group-hdr {
      background: color-mix(in srgb, var(--foreground) 3%, var(--background));
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .ln-row {
      border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      transition: background 100ms ease;
    }
    .ln-row:hover { background: color-mix(in srgb, var(--foreground) 3.5%, transparent); }
    .ln-nav {
      color: var(--muted-foreground);
      border-radius: 6px;
      transition: background 100ms ease, color 100ms ease;
    }
    .ln-nav:hover {
      background: color-mix(in srgb, var(--foreground) 5%, transparent);
      color: var(--foreground);
    }
    .ln-nav.active {
      background: color-mix(in srgb, var(--foreground) 8%, transparent);
      color: var(--foreground);
      font-weight: 500;
    }
    .ln-tab {
      color: var(--muted-foreground);
      border-radius: 6px;
      transition: background 100ms ease, color 100ms ease;
    }
    .ln-tab:hover {
      color: var(--foreground);
      background: color-mix(in srgb, var(--foreground) 4%, transparent);
    }
    .ln-tab.active {
      color: var(--foreground);
      background: color-mix(in srgb, var(--foreground) 9%, transparent);
      font-weight: 500;
    }
    .ln-btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      border-radius: 6px;
      font-weight: 500;
      transition: filter 100ms ease;
    }
    .ln-btn-primary:hover { filter: brightness(1.08); }
    .ln-btn-primary:disabled { opacity: 0.42; cursor: not-allowed; }
    .ln-btn {
      background: color-mix(in srgb, var(--foreground) 4%, transparent);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: background 100ms ease;
    }
    .ln-btn:hover { background: color-mix(in srgb, var(--foreground) 8%, transparent); }
    .ln-btn-ghost {
      color: var(--muted-foreground);
      border-radius: 6px;
      transition: background 100ms ease, color 100ms ease;
    }
    .ln-btn-ghost:hover {
      background: color-mix(in srgb, var(--foreground) 6%, transparent);
      color: var(--foreground);
    }
    .ln-btn-danger {
      background: color-mix(in srgb, var(--error) 10%, transparent);
      color: var(--error);
      border: 1px solid color-mix(in srgb, var(--error) 30%, transparent);
      border-radius: 6px;
    }
    .ln-btn-danger:hover { background: color-mix(in srgb, var(--error) 18%, transparent); }
    .ln-tag {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--foreground) 3%, transparent);
      color: var(--muted-foreground);
      border-radius: 999px;
    }
    .ln-tint-primary {
      background: color-mix(in srgb, var(--primary) 11%, transparent);
      color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 26%, transparent);
    }
    .ln-tint-success {
      background: color-mix(in srgb, var(--success) 11%, transparent);
      color: var(--success);
      border: 1px solid color-mix(in srgb, var(--success) 26%, transparent);
    }
    .ln-tint-warning {
      background: color-mix(in srgb, var(--warning) 12%, transparent);
      color: var(--warning);
      border: 1px solid color-mix(in srgb, var(--warning) 28%, transparent);
    }
    .ln-tint-error {
      background: color-mix(in srgb, var(--error) 11%, transparent);
      color: var(--error);
      border: 1px solid color-mix(in srgb, var(--error) 28%, transparent);
    }
    .ln-kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 0 5px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--foreground) 4%, transparent);
      color: var(--muted-foreground);
    }
    .diff-add { background: color-mix(in srgb, var(--success) 10%, transparent); }
    .diff-del { background: color-mix(in srgb, var(--error) 10%, transparent); }
    .diff-hunk { background: color-mix(in srgb, var(--primary) 8%, transparent); color: var(--primary); }
    .modal-mask {
      background: color-mix(in srgb, var(--background) 65%, transparent);
      backdrop-filter: blur(3px);
    }
    .pulse { animation: pulseFade 1.4s ease-in-out infinite; }
    @keyframes pulseFade { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .scroll-thin::-webkit-scrollbar { width: 5px; height: 5px; }
    .scroll-thin::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--foreground) 15%, transparent);
      border-radius: 999px;
    }
    .avatar-ring { box-shadow: 0 0 0 2px var(--background); }
  </style>
</head>
<body data-theme="dark" class="bg-[var(--background)] text-[var(--foreground)] antialiased">
  <div id="app" class="flex min-h-screen w-full"></div>
  <div id="mobile-nav-root"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-1.5 max-w-xs sm:max-w-sm"></div>

  <script>
    // =========================================================================
    // First-Class Dual Theme (Linear Dark & Linear Light) — Always Switchable!
    // Supports URL ?theme=light|dark, localStorage persistence, header toggle, & 'T' hotkey.
    // =========================================================================
    let CURRENT_THEME = "dark";
    function setTheme(mode, silent = false) {
      CURRENT_THEME = mode === "light" ? "light" : "dark";
      if (document.body && document.body.setAttribute) {
        document.body.setAttribute("data-theme", CURRENT_THEME);
      }
      try { if (typeof localStorage !== "undefined") localStorage.setItem("artoo_ui_theme", CURRENT_THEME); } catch (_) {}
      if (!silent) render();
    }
    (function initTheme() {
      let initial = "dark";
      try {
        const qs = typeof window !== "undefined" && window.location && window.location.search ? new URLSearchParams(window.location.search).get("theme") : null;
        if (qs === "light" || qs === "dark") initial = qs;
      } catch (_) {}
      setTheme(initial, true);
    })();

    // =========================================================================
    // Icons & Linear Micro-Indicators
    // =========================================================================
    const SVG = {
      logo: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>`,
      menu: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
      inbox: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>`,
      search: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
      plus: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
      bulb: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>`,
      cube: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
      cpu: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>`,
      lock: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
      users: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      settings: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
      close: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      spark: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3z"/></svg>`,
      send: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
      check: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
      pause: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`,
      stop: `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>`,
      refresh: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
      rocket: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>`,
      returnBack: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`,
      chevron: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`,
      copy: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
      back: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
      shield: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
      pr: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg>`,
      sun: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`,
      moon: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
    };

    function renderThemeToggle(compact = false) {
      return `
        <div class="inline-flex items-center border border-[var(--border)] rounded-md p-0.5 bg-[var(--content)] text-xs" role="group" aria-label="主题切换">
          <button onclick="setTheme('dark')" title="Linear 深色模式 (快捷键 T)" class="px-1.5 py-0.5 rounded flex items-center gap-1 ${CURRENT_THEME === "dark" ? "ln-tab active" : "text-[var(--muted-foreground)] hover:text-[var(--foreground)]"}">
            ${SVG.moon}${compact ? "" : `<span>暗</span>`}
          </button>
          <button onclick="setTheme('light')" title="Linear 浅色模式 (快捷键 T)" class="px-1.5 py-0.5 rounded flex items-center gap-1 ${CURRENT_THEME === "light" ? "ln-tab active" : "text-[var(--muted-foreground)] hover:text-[var(--foreground)]"}">
            ${SVG.sun}${compact ? "" : `<span>明</span>`}
          </button>
        </div>
      `;
    }

    const ROLE_META = {
      architect: { label: "产品架构师", initials: "架", color: "var(--chart-1)" },
      backend:   { label: "后端研发",   initials: "后", color: "var(--primary)" },
      frontend:  { label: "前端研发",   initials: "前", color: "var(--chart-2)" },
      qa:        { label: "测试评审",   initials: "测", color: "var(--success)" },
      user:      { label: "你",         initials: "我", color: "var(--warning)" }
    };

    function statusIcon(kind) {
      if (["done", "merged", "released", "ready_to_ship"].includes(kind)) {
        return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0" style="color:var(--success)"><circle cx="8" cy="8" r="6.5" fill="currentColor" opacity="0.16"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 8.2l1.8 1.8 3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }
      if (kind === "pr_open") {
        return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0" style="color:var(--primary)"><circle cx="4.5" cy="4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="12" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 5.8v6.2M11.5 10.2V6a2 2 0 0 0-2-2H8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
      }
      if (kind === "running" || kind === "dev") {
        return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0" style="color:var(--primary)"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.32"/><path d="M8 2 A6 6 0 1 1 2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/></svg>`;
      }
      if (kind === "review") {
        return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0" style="color:var(--warning)"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.32"/><path d="M8 2 A6 6 0 1 1 3.2 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>`;
      }
      if (kind === "blocked" || kind === "failed") {
        return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0" style="color:var(--error)"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.8v3.6M8 10.8v.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      }
      return `<svg width="14" height="14" viewBox="0 0 16 16" class="shrink-0 text-[var(--muted-foreground)]"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.4 2"/></svg>`;
    }

    function priorityIcon(p) {
      if (p === "P0") return `<svg width="13" height="13" viewBox="0 0 16 16" class="shrink-0" style="color:var(--error)" title="P0 紧急"><rect x="2" y="2" width="12" height="12" rx="3" fill="currentColor" opacity="0.16"/><path d="M8 4.8v3.8M8 11v.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
      return `<svg width="13" height="13" viewBox="0 0 16 16" class="shrink-0 text-[var(--muted-foreground)]" title="${esc(p || "P1")}"><rect x="2.5" y="10" width="2.2" height="3.5" rx="0.6" fill="currentColor"/><rect x="6.5" y="7" width="2.2" height="6.5" rx="0.6" fill="currentColor"/><rect x="10.5" y="3.5" width="2.2" height="10" rx="0.6" fill="currentColor" opacity="0.3"/></svg>`;
    }

    function isNarrowViewport() {
      return typeof window !== "undefined" && window.innerWidth < 1024;
    }

    // =========================================================================
    // Unified State — Single Source of Truth for Verification & Delivery Stages
    // =========================================================================
    const STATE = {
      // Narrow screens default to Inbox ("待我处理") so mobile users immediately see what needs them
      screen: isNarrowViewport() ? "inbox" : "project", // "inbox" | "project" | "resources"
      selectedProjectId: "p-pay",
      projectTab: "progress", // "ideas" | "progress" | "work" | "release"
      ideaMobilePane: "spec", // "spec" (分歧与拆解草案) | "chat" (完整讨论记录)
      workSubTab: "list", // "list" | "board" | "review"
      workReqFilter: "all",
      expandedReqIds: {},
      selectedIdeaIdByProject: { "p-pay": "idea-2", "p-sdk": "idea-sdk-1" },
      selectedReviewReqId: "req-02",
      selectedDiffFile: "src/webhook/signature.ts",
      selectedInboxIdx: 0,
      mobileNavOpen: false,
      drawer: null, // null | { type: "task", taskId } | { type: "projectSettings" } | { type: "teamManager" }
      modal: null, // null | "newProject" | "newIdea" | "connectNode" | "audit" | "cmd" | "decideIssue"
      modalPayload: null,
      connectOs: "windows",
      autoTimer: null,

      machines: [

    function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

    function getIdea(p = getProj()) { return p.ideas.find(i => i.id === STATE.selectedIdeaIdByProject[p.id]) || p.ideas[0]; }
    function getMachine(id) { return STATE.machines.find(m => m.id === id); }
    function getProjectInstances(pid) { return STATE.instances.filter(i => i.projectId === pid); }
    function getIdleInstances() { return STATE.instances.filter(i => i.projectId === null); }

    // Honest delivery stage label — strictly separates 已提 PR / 已合并 main / 已发布 Release!
    function getReqStageLabel(req) {
      if (req.verification?.state === "failed") return { text: `验证失败 ${req.verification.passed}/${req.verification.total}`, icon: "failed", tone: "ln-tint-error" };
      if (req.verification?.state === "repairing") return { text: `自动返修中`, icon: "dev", tone: "ln-tint-warning" };
      const map = {
        planned:       { text: "待启动",         icon: "todo",          tone: "ln-tag" },
        dev:           { text: "研发中",         icon: "dev",           tone: "ln-tint-primary" },
        review:        { text: "待你验收",       icon: "review",        tone: "ln-tint-warning" },
        ready_to_ship: { text: "已验收 · 待提 PR", icon: "ready_to_ship", tone: "ln-tint-success" },
        pr_open:       { text: req.deliveryRef || "已提 PR", icon: "pr_open", tone: "ln-tint-primary" },
        merged:        { text: "已合并 main",    icon: "merged",        tone: "ln-tint-success" },
        released:      { text: req.deliveryRef || "已发布 Release", icon: "released", tone: "ln-tint-success" }
      };
      return map[req.stage] || { text: req.stage, icon: "todo", tone: "ln-tag" };
    }

    function calcReqPct(p, req) {
      if (req.stage === "released" || req.stage === "merged") return 100;
      if (req.stage === "pr_open") return 95;
      if (req.stage === "ready_to_ship") return 90;
      if (req.verification?.state === "failed") return 60;
      const list = p.tasks.filter(t => t.reqId === req.id);
      if (!list.length) return req.stage === "planned" ? 0 : 25;
      return Math.min(88, Math.round(list.reduce((s, t) => s + t.progress, 0) / list.length));
    }

    function calcProjPct(p) {
      if (!p.requirements.length) return 0;
      return Math.round(p.requirements.reduce((s, r) => s + calcReqPct(p, r), 0) / p.requirements.length);
    }

    function getOpenDisagreements(idea) {
      return (idea.disagreements || []).filter(d => !d.resolved);
    }

    // Unified Action Inbox — prioritized: 1. Blockers/Failed Tests -> 2. Pending Review -> 3. Disagreements / Ready to Split -> 4. Ready to Ship
    function collectInbox() {
      const items = [];
      STATE.projects.forEach(p => {
        if (getProjectInstances(p.id).length === 0) {
          items.push({ priority: 0, icon: "blocked", projectId: p.id, projectName: p.name, code: "TEAM", title: "新项目尚未连接专属成员", detail: "为防记忆混淆，请先为本项目连接专属 Agent 实例。", cta: "连接专属团队", tab: "ideas" });
        }
        p.tasks.filter(t => t.status === "blocked" && t.blocker).forEach(t => {
          const req = p.requirements.find(r => r.id === t.reqId);
          items.push({ priority: 1, icon: "blocked", projectId: p.id, projectName: p.name, code: req ? req.code : t.code, title: t.blocker.headline, detail: t.blocker.detail, cta: "查看方案", tab: "progress", taskId: t.id });
        });
        p.requirements.filter(r => r.verification?.state === "failed").forEach(r => {
          items.push({ priority: 1, icon: "failed", projectId: p.id, projectName: p.name, code: r.code, title: `${r.title} · ${getReqVerifyLabel(r)}`, detail: "受保护验证发现失败用例，请启动自动返修或拉回讨论室修订。", cta: "处理失败用例", tab: "work", subTab: "review", reqId: r.id });
        });
        p.requirements.filter(r => r.stage === "review" && !r.reviewAccepted && r.verification?.state === "passed").forEach(r => {
          items.push({ priority: 2, icon: "review", projectId: p.id, projectName: p.name, code: r.code, title: `${r.title} · ${getReqVerifyLabel(r)}，等你验收`, detail: r.reviewerSummary, cta: "看 Diff 验收", tab: "work", subTab: "review", reqId: r.id });
        });
        p.ideas.filter(i => i.status !== "materialized").forEach(i => {
          const openD = getOpenDisagreements(i);
          if (openD.length > 0) {
            items.push({ priority: 3, icon: "review", projectId: p.id, projectName: p.name, code: "分歧", title: openD[0].question, detail: `议题「${i.title}」拟拆 ${i.splitRequirements.length} 个需求，剩 ${openD.length} 个分歧等你参与决定。`, cta: "参与决定", tab: "ideas", ideaId: i.id });
          } else {
            items.push({ priority: 3, icon: "done", projectId: p.id, projectName: p.name, code: "拆解", title: `「${i.title}」已无分歧，拟拆 ${i.splitRequirements.filter(x => x.checked).length} 个需求`, detail: i.proposalSummary, cta: "确认写入进度", tab: "ideas", ideaId: i.id });
          }
        });
        const ready = p.requirements.filter(r => r.stage === "ready_to_ship");
        if (ready.length) {
          items.push({ priority: 4, icon: "pr_open", projectId: p.id, projectName: p.name, code: "交付", title: `${ready.length} 项已验收需求待提 PR / 发布 (${ready.map(r => r.code).join(", ")})`, detail: "可单选提 PR 或多选打包发版本 Release。", cta: "前往交付", tab: "release" });
        }
      });
      return items.sort((a, b) => a.priority - b.priority);
    }

    function hasInfraAlert() { return STATE.machines.some(m => m.status !== "online" || m.clis.some(c => c.status === "auth_expired")); }

    function avatar(roleId, size = "w-5 h-5 text-xs", title = "") {
      const rm = ROLE_META[roleId] || ROLE_META.architect;
      return `<span class="${size} rounded-full inline-flex items-center justify-center font-medium shrink-0" style="background:color-mix(in srgb, ${rm.color} 16%, transparent); color:${rm.color}; border:1px solid color-mix(in srgb, ${rm.color} 32%, transparent)" title="${esc(title || rm.label)}">${rm.initials}</span>`;
    }

    function toast(title, desc = "", tone = "info") {
      const root = document.getElementById("toast-root");
      const el = document.createElement("div");
      const cls = tone === "success" ? "ln-tint-success" : tone === "warning" ? "ln-tint-warning" : tone === "error" ? "ln-tint-error" : "bg-[var(--card)] border border-[var(--border)]";
      el.className = `${cls} rounded-lg px-3 py-2 shadow-lg text-xs`;
      el.innerHTML = `<div class="font-medium">${esc(title)}</div>${desc ? `<div class="opacity-80 mt-0.5">${esc(desc)}</div>` : ""}`;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 200); }, 3200);
    }

    function formatMd(txt) {
      return esc(txt)
        .replace(/\n/g, "<br/>")
        .replace(/\*\*(.+?)\*\*/g, "<strong class='font-semibold text-[var(--foreground)]'>$1</strong>")
        .replace(/`(.+?)`/g, `<code class="font-mono px-1 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)]">$1</code>`);
    }

          ${STATE.screen === "inbox" ? renderInboxSplit(inbox)
            : STATE.screen === "resources" ? renderResources()

      renderDrawer();

                  <div class="px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs text-[var(--muted-foreground)]">
                    <span class="flex items-center gap-2">${SVG.lock} <span>${esc(inst.name)}</span> <span class="ln-tag px-1.5 py-0">${esc(getProj(inst.projectId)?.name || "")}</span></span>
                    <button onclick="cloneFresh('${p.id}','${inst.id}')" class="ln-btn h-6 px-2 text-xs">同机派生新实例</button>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // TAB 1: ① 想法与讨论（彻底移除共识百分比 -> 突出具体分歧 + 390px 双视图切换!）
    // =========================================================================
    function renderLinearIdeas(p) {
      const idea = getIdea(p);
      const openD = getOpenDisagreements(idea);
      const pickedCnt = idea.splitRequirements.filter(x => x.checked).length;

      return `
        <!-- Mobile Sub-Tab Switcher (390px cleanly toggles Spec/Disagreements vs Full Chat!) -->
        <div class="flex lg:hidden items-center justify-between gap-2 px-3 py-2 border-b border-[var(--border)] bg-[var(--content)] text-xs">
          <div class="flex items-center gap-1 border border-[var(--border)] rounded-md p-0.5 bg-[var(--background)]">
            <button onclick="STATE.ideaMobilePane='spec'; render();" class="px-2.5 py-1 rounded ${STATE.ideaMobilePane === "spec" ? "ln-tab active" : "text-[var(--muted-foreground)]"}">
              分歧与草案 ${openD.length > 0 ? `(${openD.length})` : ""}
            </button>
            <button onclick="STATE.ideaMobilePane='chat'; render();" class="px-2.5 py-1 rounded ${STATE.ideaMobilePane === "chat" ? "ln-tab active" : "text-[var(--muted-foreground)]"}">
              讨论记录 (${idea.messages.length})
            </button>
          </div>
          <select onchange="openIdea('${p.id}', this.value)" class="max-w-[140px] bg-[var(--background)] border border-[var(--border)] rounded px-2 py-1 text-xs text-[var(--foreground)]">
            ${p.ideas.map(it => `<option value="${it.id}" ${it.id === idea.id ? "selected" : ""}>${esc(it.title)}</option>`).join("")}
          </select>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-0 overflow-hidden">
          <!-- Desktop Left Topic Rail -->
          <aside class="hidden lg:flex lg:col-span-3 xl:col-span-2 border-r border-[var(--border)] overflow-y-auto scroll-thin flex-col">
            <div class="h-9 px-3 border-b border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
              <span>想法议题</span>
              <button onclick="openModal('newIdea')" class="ln-btn-ghost p-1" title="发起新想法">${SVG.plus}</button>
            </div>
            <div class="divide-y divide-[var(--border)]">
              ${p.ideas.map(it => {
                const active = it.id === idea.id;
                const dCnt = getOpenDisagreements(it).length;
                return `
                  <button onclick="openIdea('${p.id}','${it.id}')" class="w-full text-left px-3 py-2.5 space-y-1 ${active ? "bg-[var(--content)]" : "hover:bg-[var(--content)]/50"}">
                    <div class="flex items-start gap-1.5 text-xs">
                      <span class="mt-0.5 shrink-0">${statusIcon(it.status === "materialized" || dCnt === 0 ? "done" : "review")}</span>
                      <span class="${active ? "font-medium text-[var(--foreground)]" : "text-[var(--muted-foreground)]"} leading-snug">${esc(it.title)}</span>
                    </div>
                    <div class="pl-5 text-xs text-[var(--muted-foreground)]">
                      ${it.status === "materialized" ? "已拆入进度" : dCnt > 0 ? `拟拆 ${it.splitRequirements.length} 需求 · 剩 ${dCnt} 分歧` : `拟拆 ${it.splitRequirements.length} 需求 · 无分歧`}
                    </div>
                  </button>
                `;
              }).join("")}
            </div>
          </aside>

          <!-- Center/Right on Desktop: Spec & Disagreement First on Mobile, Side-by-Side on Desktop -->
          <!-- Pane A: Disagreements & Split Requirements Draft (Top Priority!) -->
          <section class="${STATE.ideaMobilePane === "spec" ? "flex" : "hidden"} lg:flex lg:order-3 lg:col-span-4 flex-col overflow-y-auto scroll-thin p-4 space-y-4 bg-[var(--content)]/30">
            <!-- Concrete Disagreement Decision Card (REPLACES fake Consensus %) -->
            ${openD.length > 0 ? openD.map(dis => `
              <div class="p-3.5 rounded-lg ln-tint-warning space-y-2.5">
                <div class="text-xs font-medium">拟拆 ${idea.splitRequirements.length} 个需求 · 剩 ${openD.length} 个分歧待决定</div>
                <div class="text-[14px] font-semibold leading-snug text-[var(--foreground)]">${esc(dis.question)}</div>
                <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${esc(dis.positions)}</p>
                <div class="space-y-1.5 pt-1">
                  ${dis.options.map((opt, idx) => `
                    <button onclick="resolveDisagreement('${idea.id}', '${dis.id}', ${idx})" class="${idx === 0 ? "ln-btn-primary" : "ln-btn"} w-full text-left px-3 py-1.5 text-xs">
                      ${idx === 0 ? "参与决定：" : ""}${esc(opt)}
                    </button>
                  `).join("")}
                </div>
              </div>
            `).join("") : `
              <div class="p-3 rounded-lg ln-tint-success text-xs font-medium flex items-center gap-2">
                ${SVG.check} <span>${idea.status === "materialized" ? "已拆解并写入项目进度" : `拟拆 ${pickedCnt} 个需求 · 0 个未决分歧，可确认写入项目进度`}</span>
              </div>
            `}

            <div class="space-y-1">
              <div class="text-xs font-medium text-[var(--muted-foreground)]">方案摘要</div>
              <p class="text-xs leading-relaxed text-[var(--foreground)]/90">${esc(idea.proposalSummary)}</p>
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between text-xs">
                <span class="font-medium">拆解出的需求清单</span>
                <span class="text-[var(--muted-foreground)] font-mono">已选 ${pickedCnt}/${idea.splitRequirements.length}</span>
              </div>
              <div class="border border-[var(--border)] rounded-lg overflow-hidden divide-y divide-[var(--border)] bg-[var(--background)]">
                ${idea.splitRequirements.map((sr, idx) => `
                  <label class="block px-3 py-2.5 hover:bg-[var(--content)] cursor-pointer space-y-1">
                    <div class="flex items-start justify-between gap-2">
                      <span class="flex items-start gap-2 text-[14px] font-medium leading-snug">
                        <input type="checkbox" ${sr.checked ? "checked" : ""} ${idea.status === "materialized" ? "disabled" : ""} onchange="toggleSplitReq(${idx})" class="mt-1 accent-[var(--primary)]" />
                        <span>${esc(sr.title)}</span>
                      </span>
                      ${priorityIcon(sr.priority)}
                    </div>
                    <div class="pl-5 text-xs text-[var(--muted-foreground)]">${esc(getMemberByRole(p, sr.ownerRole).name)} · ${sr.tasksPreview.join(" / ")}</div>
                  </label>
                `).join("")}
              </div>
            </div>

            <button onclick="materializeIdea()" ${pickedCnt === 0 || idea.status === "materialized" ? "disabled" : ""} class="ln-btn-primary w-full py-2 text-xs flex items-center justify-center gap-1.5">
              ${SVG.check} <span>${idea.status === "materialized" ? "已写入项目进度" : `确认拆解，写入 ${pickedCnt} 个需求到项目进度 →`}</span>
            </button>
          </section>

          <!-- Pane B: Full Multi-Agent Discussion Thread (Second Layer Context) -->
          <section class="${STATE.ideaMobilePane === "chat" ? "flex" : "hidden"} lg:flex lg:order-2 lg:col-span-5 xl:col-span-6 lg:border-r border-[var(--border)] flex-col min-h-0">
            <div class="h-10 shrink-0 px-4 border-b border-[var(--border)] flex items-center justify-between gap-2 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="font-medium truncate">${esc(idea.title)}</span>
                <span class="font-mono text-[var(--muted-foreground)] shrink-0">第 ${idea.round}/${idea.maxRounds} 轮</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                ${idea.isTyping ? `<button onclick="pauseIdea()" class="ln-btn-danger h-6 px-2 text-xs flex items-center gap-1">${SVG.pause} 暂停</button>` : `<button onclick="runIdea()" class="ln-btn-primary h-6 px-2.5 text-xs flex items-center gap-1">${SVG.spark} 自主讨论</button>`}
                ${openD.length > 0 ? `<button onclick="forceConverge()" class="ln-btn h-6 px-2 text-xs">收敛分歧</button>` : ""}
              </div>
            </div>

            <div id="idea-stream" class="flex-1 overflow-y-auto scroll-thin divide-y divide-[var(--border)]">
              ${idea.messages.map(msg => {
                const mem = getMemberByRole(p, msg.roleId);
                const tagCls = ["分歧", "风险", "回流"].includes(msg.tag) ? "ln-tint-warning" : ["同意", "收敛", "已拍板"].includes(msg.tag) ? "ln-tint-success" : "ln-tag";
                return `
                  <div class="px-4 py-3 space-y-1.5 ${msg.roleId === "user" ? "bg-[var(--content)]/60" : ""}">
                    <div class="flex items-center justify-between gap-2 text-xs">
                      <div class="flex items-center gap-2 min-w-0">
                        ${avatar(msg.roleId)}
                        <span class="font-medium truncate">${esc(mem.name)}</span>
                        <span class="${tagCls} px-1.5 py-0 rounded text-xs shrink-0">${esc(msg.tag)}</span>
                      </div>
                      <span class="font-mono text-[var(--muted-foreground)] shrink-0">${esc(msg.time)}</span>
                    </div>
                    <div class="pl-7 text-xs leading-relaxed space-y-1">
                      ${msg.quote ? `<div class="border-l-2 border-[var(--border)] pl-2.5 text-[var(--muted-foreground)]">引用：${esc(msg.quote)}</div>` : ""}
                      <div>${formatMd(msg.text)}</div>
                    </div>
                  </div>
                `;
              }).join("")}
              ${idea.isTyping ? `<div class="px-4 py-3 flex items-center gap-2 text-xs text-[var(--muted-foreground)]">${avatar(idea.typingRole || "architect")}<span class="pulse">${esc(getMemberByRole(p, idea.typingRole || "architect").name)} 正在审阅前文并回应...</span></div>` : ""}
            </div>

            <div class="p-3 border-t border-[var(--border)] bg-[var(--content)]/40 space-y-2">
              <div class="flex items-center gap-1.5 flex-wrap text-xs">
                <button onclick="quickSteer('第一期先做导出和告警，管理后台延后到二期。')" class="ln-tag px-2 py-0.5 hover:border-[var(--primary)]">先做导出和告警，砍掉后台</button>
              </div>
              <form onsubmit="sendSteer(event)" class="flex items-center gap-2">
                <input type="text" value="${esc(idea.inputDraft)}" oninput="getIdea().inputDraft=this.value" placeholder="随时插话提出要求或修正拆解方向..." class="flex-1 bg-[var(--background)] border border-[var(--border)] rounded-md px-3 py-1.5 text-xs text-[var(--foreground)] focus:outline-none focus:border-[var(--primary)]" />
                <button type="submit" class="ln-btn-primary h-7 px-3 text-xs flex items-center gap-1">${SVG.send}</button>
              </form>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // TAB 2: ② 项目进度（首屏先回答“团队在等我做什么” + 单一真相源 + 14-15px 层级！）
    // =========================================================================
    function renderLinearProgress(p) {
      const pct = calcProjPct(p);
      const team = getProjectInstances(p.id);
      const heroBlocker = p.tasks.find(t => t.status === "blocked" && t.blocker);
      const heroBlockerReq = heroBlocker ? p.requirements.find(r => r.id === heroBlocker.reqId) : null;
      const failedReqs = p.requirements.filter(r => r.verification?.state === "failed");
      const pendingReviewReqs = p.requirements.filter(r => r.stage === "review" && !r.reviewAccepted && r.verification?.state === "passed");

      // Honest, separated groups: never conflate PR open with Merged or Released!
      const groups = [
        { key: "active",   title: "研发与修复中", icon: "dev",           items: p.requirements.filter(r => r.stage === "dev" || r.stage === "planned" || r.verification?.state === "failed" || r.verification?.state === "repairing") },
        { key: "review",   title: "待你验收",     icon: "review",        items: p.requirements.filter(r => r.stage === "review" && r.verification?.state === "passed") },
        { key: "ready",    title: "已验收 · 待提 PR", icon: "ready_to_ship", items: p.requirements.filter(r => r.stage === "ready_to_ship") },
        { key: "pr_open",  title: "已提 PR (待合入)", icon: "pr_open",    items: p.requirements.filter(r => r.stage === "pr_open") },
        { key: "shipped",  title: "已合并 main / 已发布", icon: "merged", items: p.requirements.filter(r => r.stage === "merged" || r.stage === "released") }
      ].filter(g => g.items.length > 0);

      return `
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 min-h-0 overflow-hidden">
          <!-- Main Column -->
          <div class="lg:col-span-9 overflow-y-auto scroll-thin">
            ${p.failoverNotice ? `<div class="px-4 py-2 border-b border-[var(--border)] ln-tint-warning flex justify-between gap-2 text-xs"><span>⚡ 故障转移：${esc(p.failoverNotice)}</span><button onclick="getProj().failoverNotice=null; render();" class="underline shrink-0">关闭</button></div>` : ""}
            ${p.conflictNotice ? `<div class="px-4 py-2 border-b border-[var(--border)] ln-tint-primary flex justify-between gap-2 text-xs"><span>🔀 冲突自愈：${esc(p.conflictNotice)}</span><button onclick="getProj().conflictNotice=null; render();" class="underline shrink-0">关闭</button></div>` : ""}

            <!-- HERO SECTION: Answer "What is the team waiting on ME for?" FIRST! -->
            ${(heroBlocker || failedReqs.length || pendingReviewReqs.length) ? `
              <section class="px-4 py-4 border-b border-[var(--border)] bg-[var(--content)]/45 space-y-3">
                <div class="text-xs font-medium text-[var(--muted-foreground)]">团队正在等你处理</div>

                <!-- #1 Priority: Concrete Blocking Question OR Failed Verification -->
                ${heroBlocker ? `
                  <div class="p-3.5 rounded-lg border border-[var(--border)] bg-[var(--background)] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="space-y-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap text-xs">
                        <span class="ln-tint-error px-1.5 py-0.5 rounded font-medium">阻塞待拍板</span>
                        ${heroBlockerReq ? `<span class="font-mono text-[var(--muted-foreground)]">影响 ${heroBlockerReq.code}</span>` : ""}
                      </div>
                      <div class="text-[15px] font-semibold leading-snug">${esc(heroBlocker.blocker.headline)}</div>
                      <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${esc(heroBlocker.blocker.detail)}</p>
                    </div>
                    <button onclick="openTaskDrawer('${heroBlocker.id}')" class="ln-btn-primary h-8 px-3.5 text-xs shrink-0 self-start sm:self-center">查看方案</button>
                  </div>
                ` : ""}

                ${failedReqs.map(req => `
                  <div class="p-3.5 rounded-lg ln-tint-error flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="space-y-0.5 min-w-0">
                      <div class="flex items-center gap-2 text-xs font-mono"><span>${req.code}</span><span>·</span><span>${getReqVerifyLabel(req)}</span></div>
                      <div class="text-[14px] font-semibold text-[var(--foreground)]">${esc(req.title)}</div>
                      <div class="text-xs text-[var(--muted-foreground)]">受保护验证未通过，需启动自动返修或拉回讨论室修订方案。</div>
                    </div>
                    <button onclick="STATE.selectedReviewReqId='${req.id}'; STATE.workSubTab='review'; STATE.projectTab='work'; render();" class="ln-btn-primary h-8 px-3.5 text-xs shrink-0 self-start sm:self-center">查看报错并返修</button>
                  </div>
                `).join("")}

                <!-- #2 Priority: Secondary Pending Review Strip (Strictly Derived from Real Verification!) -->
                ${pendingReviewReqs.map(req => `
                  <div class="px-3.5 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--background)]/70 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2 min-w-0 flex-wrap">
                      ${statusIcon("review")}
                      <span class="font-mono text-[var(--muted-foreground)]">${req.code}</span>
                      <span class="text-[14px] font-medium truncate">${esc(req.title)}</span>
                      <span class="text-[var(--muted-foreground)]">· ${getReqVerifyLabel(req)}</span>
                    </div>
                    <button onclick="STATE.selectedReviewReqId='${req.id}'; STATE.workSubTab='review'; STATE.projectTab='work'; render();" class="ln-btn h-7 px-3 text-xs shrink-0 self-start sm:self-center">去验收 Diff</button>
                  </div>
                `).join("")}
              </section>
            ` : `
              <div class="px-4 py-3 border-b border-[var(--border)] text-xs flex items-center justify-between" style="color:var(--success)">
                <span>✓ 当前没有卡住团队的决策项，所有研发平稳推进中。</span>
              </div>
            `}

            <!-- Clean Hairline Grouped Requirements List (14px Title + 12px Muted Meta) -->
            ${groups.map(grp => `
              <div>
                <div class="ln-group-hdr h-9 px-4 flex items-center gap-2 text-xs font-medium">
                  ${statusIcon(grp.icon)} <span>${grp.title}</span> <span class="text-[var(--muted-foreground)] font-mono font-normal">${grp.items.length}</span>
                </div>
                <div>
                  ${grp.items.map(req => {
                    const st = getReqStageLabel(req);
                    const sub = p.tasks.filter(t => t.reqId === req.id);
                    const exp = !!STATE.expandedReqIds[req.id];
                    return `
                      <div class="ln-row">
                        <div onclick="toggleExpand('${req.id}')" class="cursor-pointer px-4 py-2.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2">
                          <div class="flex items-start sm:items-center gap-2.5 min-w-0 flex-1">
                            <span class="text-[var(--muted-foreground)] mt-1 sm:mt-0 transition-transform ${exp ? "rotate-90" : ""}">${SVG.chevron}</span>
                            <span class="mt-0.5 sm:mt-0">${priorityIcon(req.priority)}</span>
                            <div class="min-w-0 flex-1">
                              <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-mono text-xs text-[var(--muted-foreground)]">${req.code}</span>
                                <span class="text-[14px] font-medium leading-snug">${esc(req.title)}</span>
                              </div>
                              <div class="text-xs text-[var(--muted-foreground)] mt-0.5 flex items-center gap-2 flex-wrap">
                                <span>${getReqVerifyLabel(req)}</span>
                                <span>·</span>
                                <span>${sub.length} 个任务</span>
                                ${req.deliveryRef ? `<span>·</span><span class="font-mono">${esc(req.deliveryRef)}</span>` : ""}
                              </div>
                            </div>
                          </div>

                          <div class="flex items-center gap-2.5 shrink-0 pl-7 sm:pl-0">
                            <span class="${st.tone} px-2 py-0.5 rounded text-xs">${esc(st.text)}</span>
                            ${avatar(req.ownerRole)}
                          </div>
                        </div>

                        ${exp ? `
                          <div class="bg-[var(--content)]/45 border-t border-[var(--border)] pl-8 sm:pl-12 pr-4 py-2 divide-y divide-[var(--border)]/50">
                            ${sub.map(t => `
                              <div onclick="openTaskDrawer('${t.id}')" class="cursor-pointer py-2 px-2 -mx-2 rounded hover:bg-[var(--content)] flex flex-wrap items-center justify-between gap-2 text-xs">
                                <div class="flex items-center gap-2 min-w-0">
                                  ${statusIcon(t.status)}
                                  <span class="font-mono text-[var(--muted-foreground)]">${t.code}</span>
                                  <span class="font-medium">${esc(t.title)}</span>
                                </div>
                                <div class="flex items-center gap-2 text-[var(--muted-foreground)] font-mono">
                                  <span>${esc(getMachine(t.machineId)?.name || "")}</span>
                                  <span>${t.progress}%</span>
                                </div>
                              </div>
                            `).join("")}
                          </div>
                        ` : ""}
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            `).join("")}
          </div>

          <!-- Right Inspector (Desktop): Single Overall Progress + Dedicated Team + Normal Discussions/Activity -->
          <aside class="hidden lg:block lg:col-span-3 border-l border-[var(--border)] overflow-y-auto scroll-thin p-4 space-y-5 bg-[var(--content)]/20 text-xs">
            <div class="space-y-2.5">
              <div class="font-medium text-[var(--muted-foreground)]">项目属性</div>
              <div class="space-y-2">
                <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">推进概览</span><span class="font-mono font-medium">${pct}%</span></div>
                <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">托管仓库</span><span class="font-mono truncate max-w-[140px]">${esc(p.repo)}</span></div>
                <div class="flex justify-between"><span class="text-[var(--muted-foreground)]">验证规则</span><span class="font-mono">${esc(p.defaultVerifier)}</span></div>
              </div>
            </div>

            <div class="border-t border-[var(--border)] pt-4 space-y-2">
              <div class="flex justify-between">
                <span class="font-medium text-[var(--muted-foreground)]">专属成员 (独立记忆)</span>
                <button onclick="openTeamDrawer()" class="underline text-[var(--muted-foreground)] hover:text-[var(--foreground)]">管理</button>
              </div>
              <div class="space-y-1.5">
                ${team.map(inst => `
                  <div class="flex items-center justify-between gap-2 py-0.5">
                    <span class="flex items-center gap-2 min-w-0">${avatar(inst.role, "w-4 h-4 text-xs")} <span class="truncate font-medium">${esc(inst.name)}</span></span>
                    <span class="font-mono text-[var(--muted-foreground)] shrink-0">${inst.cli}</span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="border-t border-[var(--border)] pt-4 space-y-2.5">
              <div class="font-medium text-[var(--muted-foreground)]">团队动态与讨论进展</div>
              <div class="space-y-2.5">
                ${p.activities.slice(0, 5).map(a => `<div class="space-y-0.5"><div class="flex justify-between"><span class="font-medium">${esc(a.who)}</span><span class="font-mono text-[var(--muted-foreground)]">${esc(a.time)}</span></div><p class="text-[var(--muted-foreground)] leading-snug">${esc(a.text)}</p></div>`).join("")}
              </div>
            </div>
          </aside>
        </div>
      `;
    }

    // =========================================================================
    // TAB 3: ③ 任务与评审（验证结果单一真相源 + 逆风演练 + 逆向回流）
    // =========================================================================
    function renderLinearWork(p) {
      const tasks = STATE.workReqFilter === "all" ? p.tasks : p.tasks.filter(t => t.reqId === STATE.workReqFilter);
      const anyFailed = p.requirements.some(r => r.verification?.state === "failed");

      return `
        <div class="shrink-0 border-b border-[var(--border)] px-3 lg:px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2 flex-wrap">
            <div class="flex items-center gap-0.5 border border-[var(--border)] rounded-md p-0.5">
              ${[["list","任务列表"],["board","看板"],["review", anyFailed ? "评审 (测试失败)" : "代码评审与测试"]].map(([k,l]) => `<button onclick="STATE.workSubTab='${k}'; render();" class="px-2 py-0.5 rounded text-xs ${STATE.workSubTab === k ? "ln-tab active" : "text-[var(--muted-foreground)]"}">${l}</button>`).join("")}
            </div>
            ${STATE.workSubTab !== "review" ? `<select onchange="STATE.workReqFilter=this.value; render();" class="bg-[var(--background)] border border-[var(--border)] rounded-md px-2 py-1 text-xs text-[var(--foreground)]"><option value="all" ${STATE.workReqFilter === "all" ? "selected" : ""}>全部需求 (${p.tasks.length})</option>${p.requirements.map(r => `<option value="${r.id}" ${STATE.workReqFilter === r.id ? "selected" : ""}>${r.code}</option>`).join("")}</select>` : ""}
          </div>
          <div class="flex items-center gap-1.5 flex-wrap text-xs">
            <button onclick="drillTestFailure()" class="ln-btn h-6 px-2 text-xs">单测失败→返修</button>
            <button onclick="drillGitConflict()" class="ln-btn h-6 px-2 text-xs">冲突自愈</button>
            <button onclick="drillNodeFailover()" class="ln-btn h-6 px-2 text-xs">断网接管</button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto scroll-thin">
          ${STATE.workSubTab === "list" ? renderLinearTaskList(p, tasks) : STATE.workSubTab === "board" ? renderLinearBoard(p, tasks) : renderLinearReview(p)}
        </div>
      `;
    }

    function renderLinearTaskList(p, tasks) {
      const groups = [
        { k: "blocked", title: "阻塞待拍板", list: tasks.filter(t => t.status === "blocked") },
        { k: "running", title: "进行中",     list: tasks.filter(t => t.status === "running") },
        { k: "review",  title: "评审与验证", list: tasks.filter(t => t.status === "review") },
        { k: "todo",    title: "待开始",     list: tasks.filter(t => t.status === "todo" || t.status === "stopped") },
        { k: "done",    title: "已完成",     list: tasks.filter(t => t.status === "done") }
      ].filter(g => g.list.length > 0);

      return groups.length === 0 ? `<div class="p-8 text-center text-xs text-[var(--muted-foreground)]">暂无任务</div>` : groups.map(g => `
        <div>
          <div class="ln-group-hdr h-8 px-4 flex items-center gap-2 text-xs font-medium">${statusIcon(g.k)} <span>${g.title}</span> <span class="font-mono text-[var(--muted-foreground)] font-normal">${g.list.length}</span></div>
          ${g.list.map(t => {
            const req = p.requirements.find(r => r.id === t.reqId);
            const vBadge = (t.status === "review" && req) ? getReqVerifyLabel(req) : "";
            return `
              <div onclick="openTaskDrawer('${t.id}')" class="ln-row cursor-pointer px-4 py-2.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                  ${statusIcon(req?.verification?.state === "failed" && t.status === "review" ? "failed" : t.status)}
                  <span class="font-mono text-[var(--muted-foreground)] shrink-0">${t.code}</span>
                  <span class="text-[14px] font-medium truncate">${esc(t.title)}</span>
                  ${req ? `<span class="ln-tag px-1.5 py-0 font-mono hidden sm:inline shrink-0">${req.code}</span>` : ""}
                </div>
                <div class="flex items-center gap-2.5 shrink-0 text-[var(--muted-foreground)] pl-6 sm:pl-0">
                  ${vBadge ? `<span class="${req.verification.state === "failed" ? "ln-tint-error" : "ln-tag"} px-1.5 py-0 rounded">${esc(vBadge)}</span>` : ""}
                  <span class="hidden md:inline font-mono">${esc(getMachine(t.machineId)?.name || "")}</span>
                  <span class="font-mono">${t.progress}%</span>
                  ${avatar(t.roleId)}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `).join("");
    }

    function renderLinearBoard(p, tasks) {
      const cols = [["todo","待开始"],["running","进行中"],["blocked","需拍板"],["review","待验收"],["done","已完成"]];
      return `<div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 h-full divide-y md:divide-y-0 md:divide-x divide-[var(--border)]">${cols.map(([k, title]) => {
        const list = tasks.filter(t => t.status === k);
        return `<div class="p-2.5 space-y-2"><div class="px-1.5 py-1 flex justify-between text-xs font-medium"><span class="flex items-center gap-1.5">${statusIcon(k)} ${title}</span><span class="font-mono text-[var(--muted-foreground)]">${list.length}</span></div>${list.map(t => `<div onclick="openTaskDrawer('${t.id}')" class="cursor-pointer p-2.5 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:border-[var(--primary)] space-y-1.5"><div class="font-mono text-xs text-[var(--muted-foreground)]">${t.code}</div><div class="text-[14px] font-medium leading-snug">${esc(t.title)}</div><div class="flex justify-between pt-1 text-xs">${avatar(t.roleId)}<span class="font-mono text-[var(--muted-foreground)]">${t.progress}%</span></div></div>`).join("")}</div>`;
      }).join("")}</div>`;
    }

    function renderLinearReview(p) {
      const reqs = p.requirements.filter(r => !["merged", "released"].includes(r.stage));
      const activeReq = reqs.find(r => r.id === STATE.selectedReviewReqId) || reqs[0] || p.requirements[0];
      const v = activeReq ? activeReq.verification : { state: "none", passed: 0, total: 0, lastRunAt: "--", repairAttempt: 0, failingLog: null };
      const files = Object.keys(p.diffs);
      const activeFile = files.includes(STATE.selectedDiffFile) ? STATE.selectedDiffFile : files[0];
      const lines = p.diffs[activeFile] || [];

      return `
        <div>
          ${activeReq ? `
            <div class="px-4 py-2 border-b border-[var(--border)] flex flex-wrap items-center gap-1.5 text-xs bg-[var(--content)]/40">
              <span class="text-[var(--muted-foreground)]">审阅需求：</span>
              ${reqs.map(r => `<button onclick="STATE.selectedReviewReqId='${r.id}'; render();" class="px-2 py-0.5 rounded-md ${r.id === activeReq.id ? "ln-tint-primary font-medium" : "ln-btn-ghost"}">${r.code} ${esc(r.title)}</button>`).join("")}
            </div>
          ` : ""}

          ${v.state === "failed" || v.state === "repairing" ? `
            <div class="px-4 py-3 border-b border-[var(--border)] ${v.state === "repairing" ? "ln-tint-warning" : "ln-tint-error"} space-y-2 text-xs">
              <div class="flex flex-wrap justify-between gap-2">
                <span class="font-medium">${v.state === "repairing" ? `自动返修进行中（第 ${v.repairAttempt}/${p.maxAutoRepairs} 轮）...` : `${activeReq.code} 受保护验证失败 (${v.passed}/${v.total})`}</span>
                ${v.state === "failed" ? `
                  <div class="flex gap-1.5 flex-wrap">
                    <button onclick="triggerAutoRepair('${activeReq.id}')" class="ln-btn-primary h-7 px-3 text-xs">启动自动返修</button>
                    <button onclick="sendBackToIdea('${activeReq.code} 受保护验证失败（${v.passed}/${v.total}），拉回想法讨论室修订方案。')" class="ln-btn h-7 px-2.5 text-xs flex items-center gap-1">${SVG.returnBack} 拉回讨论室</button>
                  </div>
                ` : ""}
              </div>
              ${v.failingLog ? `<pre class="p-2.5 rounded bg-[var(--background)] border border-[var(--border)] font-mono text-xs overflow-x-auto text-[var(--foreground)]">${esc(v.failingLog)}</pre>` : ""}
            </div>
          ` : ""}

          <div class="grid grid-cols-1 lg:grid-cols-12">
            <div class="lg:col-span-8 lg:border-r border-[var(--border)]">
              <div class="h-9 px-3 border-b border-[var(--border)] flex items-center gap-1 overflow-x-auto">${files.map(f => `<button onclick="STATE.selectedDiffFile='${f}'; render();" class="px-2 py-1 rounded text-xs font-mono ${f === activeFile ? "ln-tab active" : "ln-btn-ghost"}">${esc(f)}</button>`).join("")}</div>
              <div class="font-mono text-xs overflow-x-auto scroll-thin">${lines.map(l => l.t === "h" ? `<div class="diff-hunk px-4 py-1">${esc(l.text)}</div>` : `<div class="${l.t === "a" ? "diff-add" : l.t === "d" ? "diff-del" : ""} flex leading-6 border-b border-[var(--border)]/30"><span class="w-8 shrink-0 text-right pr-2 text-[var(--muted-foreground)] opacity-60">${l.o}</span><span class="w-8 shrink-0 text-right pr-2 text-[var(--muted-foreground)] opacity-60 border-r border-[var(--border)]">${l.n}</span><span class="w-5 shrink-0 text-center font-bold" style="color:${l.t === "a" ? "var(--success)" : l.t === "d" ? "var(--error)" : "var(--muted-foreground)"}">${l.t === "a" ? "+" : l.t === "d" ? "-" : " "}</span><span class="pr-4 whitespace-pre">${esc(l.text)}</span></div>`).join("")}</div>
            </div>

            <div class="lg:col-span-4 p-4 space-y-4 bg-[var(--content)]/20 text-xs border-t lg:border-t-0 border-[var(--border)]">
              <div class="space-y-2 pb-3 border-b border-[var(--border)]">
                <div class="flex justify-between font-medium"><span>受保护测试验证</span><span style="color:${v.state === "passed" ? "var(--success)" : "var(--error)"}">${v.passed}/${v.total}</span></div>
                <div class="text-[var(--muted-foreground)] font-mono">${esc(p.defaultVerifier)} · ${esc(v.lastRunAt)}</div>
                <button onclick="rerunTests('${activeReq.id}')" class="ln-btn w-full py-1.5 text-xs flex items-center justify-center gap-1">${SVG.refresh} 重跑受保护验证</button>
              </div>
              <div class="space-y-2.5">
                <div class="flex justify-between font-medium"><span>独立只读评审</span><span style="color:var(--success)">建议通过</span></div>
                <p class="text-[var(--muted-foreground)] leading-relaxed">${esc(activeReq?.reviewerSummary || "")}</p>
                ${activeReq ? `<button onclick="acceptReq('${activeReq.id}')" ${v.state !== "passed" ? "disabled" : ""} class="ln-btn-primary w-full py-2 text-xs">${activeReq.reviewAccepted ? `✓ ${activeReq.code} 已验收 · 去交付 →` : v.state !== "passed" ? "验证未通过，禁止验收" : `验收 ${activeReq.code}，进入待提 PR 池`}</button>` : ""}
                <button onclick="sendBackToIdea('代码评审发现设计边界问题，拉回讨论室修订。')" class="ln-btn w-full py-1.5 text-xs flex items-center justify-center gap-1">${SVG.returnBack} 方案有问题 · 拉回讨论室</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // TAB 4: ④ 交付与发布（严格区分：已验收待提 PR -> 已提 PR -> 已合并 main -> 已发布 Release）
    // =========================================================================
    function renderLinearRelease(p) {
      const rel = p.release;
      const readyReqs = p.requirements.filter(r => r.stage === "ready_to_ship" && r.verification?.state === "passed");
      const openPrReqs = p.requirements.filter(r => r.stage === "pr_open");
      const picked = readyReqs.filter(r => r.selectedForRelease);
      const prNodes = STATE.machines.filter(m => m.status === "online" && m.prProjects.includes(p.id));
      const hasPr = prNodes.length > 0;

      return `
        <div class="flex-1 overflow-y-auto scroll-thin p-4 lg:p-6">
          <div class="max-w-3xl mx-auto space-y-5">
            ${!hasPr ? `<div class="p-3 rounded-lg ln-tint-error flex flex-wrap items-center justify-between gap-2 text-xs"><span>无在线节点持有 ${esc(p.name)} 的 Git PR 推送权限。</span><button onclick="STATE.screen='resources'; render();" class="ln-btn-primary h-7 px-2.5 text-xs">算力设置</button></div>` : ""}

            <!-- 1. Ready to Ship Pool -->
            <div class="space-y-2">
              <div class="flex justify-between items-center text-xs">
                <span class="font-medium">已验收待交付需求（单选提 PR · 多选打包发版）</span>
                <button onclick="openModal('audit')" class="ln-btn-ghost px-2 py-1 text-xs">审计 JSON</button>
              </div>
              <div class="border border-[var(--border)] rounded-lg overflow-hidden divide-y divide-[var(--border)]">
                ${readyReqs.length === 0 ? `
                  <div class="p-4 text-xs text-[var(--muted-foreground)] flex flex-wrap justify-between items-center gap-2">
                    <span>暂无「已验收待交付」需求</span>
                    <button onclick="STATE.workSubTab='review'; STATE.projectTab='work'; render();" class="ln-btn-primary h-7 px-3 text-xs">去验收需求 →</button>
                  </div>
                ` : readyReqs.map(r => `
                  <label class="px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2 hover:bg-[var(--content)] cursor-pointer text-xs">
                    <span class="flex items-center gap-2.5">
                      <input type="checkbox" ${r.selectedForRelease ? "checked" : ""} onchange="toggleReleaseReq('${r.id}')" class="accent-[var(--primary)]" />
                      ${statusIcon("ready_to_ship")}
                      <span class="font-mono text-[var(--muted-foreground)]">${r.code}</span>
                      <span class="text-[14px] font-medium">${esc(r.title)}</span>
                    </span>
                    <span class="text-[var(--muted-foreground)]">${getReqVerifyLabel(r)}</span>
                  </label>
                `).join("")}
              </div>
            </div>

            <!-- 2. Delivery Executor -->
            <div class="border border-[var(--border)] rounded-lg p-4 space-y-3 bg-[var(--content)]/30 text-xs">
              <div class="flex flex-wrap justify-between items-center gap-2">
                <span class="font-medium">受保护执行节点：${hasPr ? esc(prNodes[0].name) : "无在线节点"}</span>
                <div class="flex gap-1 border border-[var(--border)] rounded-md p-0.5">
                  <button onclick="getProj().release.kind='git_pr'; render();" class="px-2 py-0.5 rounded ${rel.kind === "git_pr" ? "ln-tab active" : "text-[var(--muted-foreground)]"}">git_pr (创建 PR)</button>
                  <button onclick="getProj().release.kind='github_release'; render();" class="px-2 py-0.5 rounded ${rel.kind === "github_release" ? "ln-tab active" : "text-[var(--muted-foreground)]"}">github_release (${rel.releaseTag})</button>
                </div>
              </div>
              <div class="flex flex-wrap justify-between items-center gap-3">
                <span class="text-[var(--muted-foreground)] font-mono">${esc(p.repo)} · ${picked.length ? picked.map(r => r.code).join(" + ") : "未勾选"}</span>
                <button onclick="executeRelease()" ${(!hasPr || !picked.length || rel.status === "releasing") ? "disabled" : ""} class="ln-btn-primary h-7 px-3 text-xs flex items-center gap-1">
                  ${SVG.rocket} ${rel.status === "releasing" ? "执行中..." : rel.kind === "git_pr" ? `审批并创建 PR (${picked.length})` : `审批并发布 ${rel.releaseTag} (${picked.length})`}
                </button>
              </div>
            </div>

            <!-- 3. Active Open PR Status (Strictly distinct from Merged / Deployed!) -->
            ${(rel.status === "pr_open" || rel.status === "releasing" || openPrReqs.length > 0) ? `
              <div class="border border-[var(--border)] rounded-lg p-4 space-y-3 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="font-semibold flex items-center gap-2">
                    ${statusIcon("pr_open")}
                    <span>${rel.status === "releasing" ? "正在推送隔离分支并创建 PR..." : `已提 PR #${rel.prNumber}（尚未合入 main，未部署上线）`}</span>
                  </span>
                  <span class="font-mono underline">${esc(rel.prUrl)}</span>
                </div>
                <div class="divide-y divide-[var(--border)] border border-[var(--border)] rounded-md bg-[var(--background)]">
                  ${rel.ciChecks.map(c => `<div class="px-3 py-1.5 flex justify-between"><span>${esc(c.name)}</span><span class="font-mono" style="color:${c.status === "pass" ? "var(--success)" : c.status === "running" ? "var(--primary)" : "var(--muted-foreground)"}">${c.status === "pass" ? "PASS" : c.status === "running" ? "running..." : "queued"}</span></div>`).join("")}
                </div>
                ${rel.status === "pr_open" ? `
                  <div class="flex flex-wrap justify-end gap-2 pt-1">
                    <button onclick="rollbackRelease()" class="ln-btn-danger h-7 px-3 text-xs">撤回并关闭 PR</button>
                    <button onclick="confirmPrMerged()" class="ln-btn-primary h-7 px-3 text-xs">模拟 PR #${rel.prNumber} 已合入 main →</button>
                  </div>
                ` : ""}
              </div>
            ` : ""}

            <!-- 4. Honest Delivery History -->
            <div class="space-y-1.5 text-xs">
              <div class="text-[var(--muted-foreground)] font-medium">交付记录（严格区分已提 PR / 已合并 main / 已发布 Release）</div>
              <div class="border border-[var(--border)] rounded-lg divide-y divide-[var(--border)]">
                ${rel.history.map(h => `
                  <div class="px-3.5 py-2 flex flex-wrap justify-between gap-2">
                    <span class="flex items-center gap-2"><span class="font-mono text-[var(--muted-foreground)]">${h.time}</span><span class="font-medium">${esc(h.ref)}</span><span class="text-[var(--muted-foreground)]">${esc(h.reqs)}</span></span>
                    <span class="${h.state.includes("回滚") ? "ln-tint-error" : h.state.includes("PR") ? "ln-tint-primary" : "ln-tint-success"} px-2 py-0 rounded">${esc(h.state)}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // SCREEN C: 算力电脑与单项目专属实例隔离
    // =========================================================================
    function renderResources() {
      return `
        <header class="h-11 shrink-0 border-b border-[var(--border)] px-3 lg:px-4 flex items-center justify-between text-xs">
          <div class="flex items-center gap-2">
            <button onclick="STATE.mobileNavOpen=true; render();" class="lg:hidden ln-btn-ghost p-1.5">${SVG.menu}</button>
            <button onclick="STATE.screen='project'; render();" class="hidden lg:inline-flex ln-btn-ghost h-7 px-2 items-center gap-1">${SVG.back} 返回</button>
            <span class="font-medium truncate">算力与专属实例 (1 实例 = 1 项目)</span>
          </div>
          <div class="flex items-center gap-2">
            ${renderThemeToggle(true)}
            <button onclick="openModal('connectNode')" class="ln-btn-primary h-7 px-2.5 text-xs flex items-center gap-1">${SVG.plus} 连接电脑</button>
          </div>
        </header>
        <div class="flex-1 overflow-y-auto scroll-thin divide-y divide-[var(--border)]">
          ${STATE.machines.map(m => {
            const hosted = STATE.instances.filter(i => i.machineId === m.id);
            return `
              <div class="px-4 lg:px-5 py-4 space-y-3 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="w-2 h-2 rounded-full" style="background:${m.status === "online" ? "var(--success)" : "var(--error)"}"></span>
                    <span class="text-[14px] font-semibold">${esc(m.name)}</span>
                    <span class="text-[var(--muted-foreground)]">${esc(m.os)} · CPU ${m.cpu}% · ${m.slots}</span>
                  </div>
                  <button onclick="toggleNode('${m.id}')" class="ln-btn h-6 px-2 text-xs">${m.status === "online" ? "模拟离线" : "恢复上线"}</button>
                </div>
                <div class="pl-3 space-y-1">
                  ${m.clis.map(c => `
                    <div class="flex flex-wrap items-center justify-between gap-2 py-1">
                      <span class="flex items-center gap-2 flex-wrap">${statusIcon(c.status === "ready" ? "done" : "blocked")}<span class="font-medium">${esc(c.name)}</span><span class="font-mono text-[var(--muted-foreground)]">v${c.ver} · ${c.tier}</span>${c.status === "auth_expired" ? `<span style="color:var(--warning)">${esc(c.fixHint)}</span>` : ""}</span>
                      ${c.status === "auth_expired" ? `<button onclick="reverify('${m.id}','${c.id}')" class="ln-btn-primary h-6 px-2 text-xs">重新验证</button>` : `<span class="text-[var(--muted-foreground)]">就绪</span>`}
                    </div>
                  `).join("")}
                </div>
                <div class="pl-3 space-y-1">
                  <div class="text-[var(--muted-foreground)]">本机隔离实例 (${hosted.length})</div>
                  <div class="border border-[var(--border)] rounded-md divide-y divide-[var(--border)]">
                    ${hosted.map(inst => `
                      <div class="px-3 py-2 flex flex-wrap items-center justify-between gap-2 bg-[var(--content)]/30">
                        <span class="flex items-center gap-2">${avatar(inst.role, "w-4 h-4 text-xs")}<span class="font-medium">${esc(inst.name)}</span><span class="font-mono text-[var(--muted-foreground)]">${inst.cli}</span></span>
                        <span class="${inst.projectId ? "ln-tint-primary" : "ln-tag"} px-2 py-0 rounded">${inst.projectId ? `专属：${esc(getProj(inst.projectId)?.name || "")}` : "空闲可认领"}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    // =========================================================================
    // Drawers & Modals
    // =========================================================================
    function renderDrawer() {
      const root = document.getElementById("drawer-root");
      if (!STATE.drawer) { root.innerHTML = ""; return; }
      const p = getProj();

      if (STATE.drawer.type === "teamManager") {
        const current = getProjectInstances(p.id), idle = getIdleInstances(), occupied = getOtherProjectInstances(p.id);
        root.innerHTML = `
          <div onclick="if(event.target===this) closeDrawer()" class="modal-mask fixed inset-0 z-40 flex justify-end">
            <div class="bg-[var(--background)] border-l border-[var(--border)] w-full max-w-lg h-full p-4 overflow-y-auto scroll-thin flex flex-col justify-between gap-4 shadow-2xl text-xs">

    function renderModal() {

      } else if (STATE.modal === "newProject") {
        html = `

            <input id="np-repo" value="acme/ai-support-kb" class="w-full bg-[var(--content)] border border-[var(--border)] rounded-md px-3 py-1.5 font-mono text-xs text-[var(--foreground)]" />

          </div>

        const cmd = STATE.connectOs === "windows"
          ? `npx -y @jiayunxie/artood@0.2.0 connect --server https://artoo.acme.dev --code K7M4-P9QX`
          : `npx -y @jiayunxie/artood@0.2.0 connect --server https://artoo.acme.dev --code K7M4-P9QX && ~/.artoo/daemon/artood service install`;
        html = `

            <div class="flex gap-1.5">${[["windows","Windows"],["macos","macOS"],["linux","Linux"]].map(([k,l]) => `<button onclick="STATE.connectOs='${k}'; renderModal();" class="px-2.5 py-1 rounded-md border ${STATE.connectOs === k ? "ln-tint-primary font-medium" : "border-[var(--border)]"}">${l}</button>`).join("")}</div>

          </div>
        `;
      } else if (STATE.modal === "audit") {
        const out = JSON.stringify({
          schema: "artoo.project.audit.v1", project: p.name, repo: p.repo,
          dedicated_instances: getProjectInstances(p.id).map(i => ({ id: i.id, memory: i.memoryScope })),
          requirements: p.requirements.map(r => ({ code: r.code, stage: r.stage, verification: getReqVerifyLabel(r), delivery: r.deliveryRef }))
        }, null, 2);
