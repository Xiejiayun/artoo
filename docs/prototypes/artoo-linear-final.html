    // =========================================================================
    // Actions (All State Mutations Maintain Strict Cross-View Consistency!)
    // =========================================================================
    function selectProject(pid) {
      STATE.selectedProjectId = pid; STATE.screen = "project"; STATE.mobileNavOpen = false;
      STATE.projectTab = getProj(pid).requirements.length === 0 ? "ideas" : "progress";
      STATE.workReqFilter = "all"; render();
    }
    function openIdea(pid, iid) { STATE.selectedProjectId = pid; STATE.selectedIdeaIdByProject[pid] = iid; STATE.screen = "project"; STATE.projectTab = "ideas"; render(); }
    function toggleExpand(rid) { STATE.expandedReqIds[rid] = !STATE.expandedReqIds[rid]; render(); }
    function openModal(m) { STATE.modal = m; renderModal(); }
    function closeModal() { STATE.modal = null; renderModal(); }
    function openTaskDrawer(taskId) { STATE.drawer = { type: "task", taskId }; renderDrawer(); }
    function openProjectSettings() { STATE.drawer = { type: "projectSettings" }; renderDrawer(); }
    function openTeamDrawer() { STATE.drawer = { type: "teamManager" }; renderDrawer(); }
    function closeDrawer() { STATE.drawer = null; renderDrawer(); }
    function copyEl(id) { const el = document.getElementById(id); if (el && navigator.clipboard) navigator.clipboard.writeText(el.textContent).catch(() => {}); toast("已复制", "", "success"); }
    function scrollIdea() { setTimeout(() => { const el = document.getElementById("idea-stream"); if (el) el.scrollTop = el.scrollHeight; }, 25); }

    function jumpFromInbox(pid, tab, ideaId, subTab, taskId, reqId) {
      STATE.selectedProjectId = pid; STATE.screen = "project"; STATE.projectTab = tab;
      if (ideaId) STATE.selectedIdeaIdByProject[pid] = ideaId;
      if (subTab) STATE.workSubTab = subTab;
      if (reqId) STATE.selectedReviewReqId = reqId;
      render();
      if (taskId) openTaskDrawer(taskId);
    }

    // Dedicated 1:1 Team Isolation Actions
    function provisionFullTeam(pid) {
      const p = getProj(pid), slug = p.repo.split("/").pop() || pid;
      [{ role: "architect", m: "m-mac", cli: "gemini" }, { role: "backend", m: "m-win", cli: "codex" }, { role: "frontend", m: "m-mac", cli: "claude-code" }, { role: "qa", m: "m-lin", cli: "copilot" }].forEach((sp, i) => {
        STATE.instances.push({ id: `inst-${pid}-${sp.role}-${Date.now()}-${i}`, name: `${slug.slice(0, 6)}-${ROLE_META[sp.role].label}`, role: sp.role, projectId: pid, machineId: sp.m, cli: sp.cli, memoryScope: `mem://${slug}/${sp.role}` });
      });
      STATE.projectTab = "ideas"; toast("已派生 4 个专属隔离实例", "", "success"); render();
    }
    function createDedicated(pid) {
      const p = getProj(pid), slug = p.repo.split("/").pop() || pid;
      const role = document.getElementById("tm-role")?.value || "backend", machineId = document.getElementById("tm-machine")?.value || "m-win", cli = document.getElementById("tm-cli")?.value || "codex";
      STATE.instances.push({ id: `inst-${Date.now()}`, name: `${slug.slice(0, 6)}-${ROLE_META[role].label}`, role, projectId: pid, machineId, cli, memoryScope: `mem://${slug}/${role}` });
      toast("已新建专属隔离实例", "", "success"); render();
    }
    function claimIdle(pid, instId) {
      const p = getProj(pid), inst = STATE.instances.find(i => i.id === instId); if (!inst || inst.projectId !== null) return;
      const slug = p.repo.split("/").pop() || pid;
      inst.projectId = pid; inst.name = `${slug.slice(0, 6)}-${ROLE_META[inst.role].label}`; inst.memoryScope = `mem://${slug}/${inst.role}`;
      toast(`已独占认领 ${inst.name}`, "", "success"); render();
    }
    function cloneFresh(pid, srcId) {
      const p = getProj(pid), src = STATE.instances.find(i => i.id === srcId); if (!src) return;
      const slug = p.repo.split("/").pop() || pid;
      STATE.instances.push({ id: `inst-c-${Date.now()}`, name: `${slug.slice(0, 6)}-${ROLE_META[src.role].label}`, role: src.role, projectId: pid, machineId: src.machineId, cli: src.cli, memoryScope: `mem://${slug}/${src.role}-fresh` });
      toast("已同机派生全新隔离实例", "记忆与目录完全独立", "success"); render();
    }
    function detachInst(instId) {
      const inst = STATE.instances.find(i => i.id === instId); if (!inst) return;
      inst.projectId = null; inst.memoryScope = "已重置 (干净记忆)";
      toast(`已释放 ${inst.name}`, "", "warning"); render();
    }

    // Disagreement-Driven Discussion Actions
    function resolveDisagreement(ideaId, disId, optIdx) {
      const p = getProj(), idea = p.ideas.find(i => i.id === ideaId); if (!idea) return;
      const dis = idea.disagreements.find(d => d.id === disId); if (!dis) return;
      dis.resolved = true; dis.resolution = dis.options[optIdx];
      idea.messages.push({ id: "ud-" + Date.now(), roleId: "user", time: nowHM(), tag: "已拍板", quote: dis.question, text: `决定采用：${dis.resolution}` });
      idea.status = getOpenDisagreements(idea).length === 0 ? "ready_to_split" : "discussing";
      p.activities.unshift({ time: "刚刚", who: "你", text: `拍板分歧：${dis.resolution}` });
      toast("分歧已解决", "现在可以直接确认拆解写入项目进度", "success");
      render(); scrollIdea();
    }
    function pauseIdea() { if (STATE.autoTimer) { clearTimeout(STATE.autoTimer); STATE.autoTimer = null; } const i = getIdea(); i.isTyping = false; i.typingRole = null; render(); }
    function runIdea() {
      const p = getProj(), idea = getIdea(p); if (idea.isTyping) return;
      if (idea.round >= idea.maxRounds) { toast("已达轮次上限，请点击收敛分歧", "", "warning"); return; }
      const script = idea.scriptedRounds[idea.scriptIdx] || [{ roleId: "architect", tag: "收敛", text: "团队已对齐边界，剩余分歧已关闭，可确认写入项目进度。" }];
      if (idea.scriptIdx < idea.scriptedRounds.length) idea.scriptIdx++;
      idea.round++; idea.isTyping = true; idea.typingRole = script[0].roleId; render(); scrollIdea();
      let step = 0;
      function next() {
        if (!idea.isTyping) return;
        const m = script[step++];
        idea.messages.push({ id: "m-" + Date.now() + "-" + step, roleId: m.roleId, time: nowHM(), tag: m.tag, quote: m.quote || null, text: m.text });
        if (step < script.length) { idea.typingRole = script[step].roleId; render(); scrollIdea(); STATE.autoTimer = setTimeout(next, 650); }
        else { idea.isTyping = false; idea.typingRole = null; idea.disagreements.forEach(d => d.resolved = true); idea.status = "ready_to_split"; toast("已无未决分歧", "可一键确认拆解写入项目进度", "success"); render(); scrollIdea(); }
      }
      STATE.autoTimer = setTimeout(next, 600);
    }
    function forceConverge() { pauseIdea(); const i = getIdea(); i.disagreements.forEach(d => d.resolved = true); i.status = "ready_to_split"; i.messages.push({ id: "fc-" + Date.now(), roleId: "architect", time: nowHM(), tag: "收敛", text: "已收敛剩余分歧并锁定拆解草案。" }); render(); scrollIdea(); }
    function quickSteer(t) { getIdea().inputDraft = t; sendSteer({ preventDefault() {} }); }
    function sendSteer(e) {
      e.preventDefault(); const i = getIdea(), txt = (i.inputDraft || "").trim(); if (!txt) return;
      i.inputDraft = ""; i.messages.push({ id: "u-" + Date.now(), roleId: "user", time: nowHM(), tag: "引导", text: txt });
      i.isTyping = true; i.typingRole = "architect"; render(); scrollIdea();
      STATE.autoTimer = setTimeout(() => {
        if (txt.includes("砍掉后台") && i.splitRequirements.length >= 3) i.splitRequirements[2].checked = false;
        i.messages.push({ id: "a-" + Date.now(), roleId: "architect", time: nowHM(), tag: "收敛", quote: txt.slice(0, 22), text: "已按你的指示更新拆解草案。" });
        i.isTyping = false; i.typingRole = null; i.disagreements.forEach(d => d.resolved = true); i.status = "ready_to_split"; render(); scrollIdea();
      }, 600);
    }
    function toggleSplitReq(idx) { const sr = getIdea().splitRequirements[idx]; if (sr) sr.checked = !sr.checked; render(); }
    function materializeIdea() {
      const p = getProj(), idea = getIdea(p), picked = idea.splitRequirements.filter(x => x.checked); if (!picked.length) return;
      const base = 104 + p.requirements.length;
      picked.forEach((sr, idx) => {
        const rid = "req-" + Date.now() + "-" + idx, code = "PAY-" + (base + idx);
        p.requirements.unshift({
          id: rid, code, title: sr.title, sourceIdea: idea.title, priority: sr.priority, stage: idx === 0 ? "dev" : "planned",
          ownerRole: sr.ownerRole, reviewAccepted: false, selectedForRelease: false, deliveryRef: null, updated: "刚刚",
          verification: { state: "none", passed: 0, total: 0, lastRunAt: "--", repairAttempt: 0, failingLog: null },
          reviewerSummary: "待开发完成后执行独立评审。"
        });
        sr.tasksPreview.forEach((tt, ti) => p.tasks.unshift({ id: "t-" + Date.now() + "-" + idx + "-" + ti, reqId: rid, code: `T-${p.tasks.length + 1}`, title: tt, status: idx === 0 && ti === 0 ? "running" : "todo", roleId: sr.ownerRole, machineId: getMemberByRole(p, sr.ownerRole).inst?.machineId || "m-win", progress: idx === 0 && ti === 0 ? 25 : 0, branch: `artoo/${code.toLowerCase()}/t-${ti + 1}`, closureState: idx === 0 && ti === 0 ? "运行中" : "已入队", blocker: null, logs: [`[${nowHM()}] 由想法拆解生成`] }));
      });
      idea.status = "materialized"; STATE.projectTab = "progress";
      toast(`已将 ${picked.length} 个需求写入项目进度`, "", "success"); render();
    }
    function sendBackToIdea(reason) {
      const p = getProj(), iid = "idea-rev-" + Date.now();
      p.ideas.unshift({
        id: iid, title: "方案修订（执行/评审回流）", status: "discussing", mode: "auto", round: 1, maxRounds: 5, isTyping: false, typingRole: null, inputDraft: "", scriptIdx: 0,
        proposalSummary: reason,
        disagreements: [{ id: "dr-" + Date.now(), question: reason, positions: "需负责人与架构师确认修订边界。", resolved: false, options: ["拆出专项修复需求并补全边界单测（推荐）", "暂缓该需求，先交付其他需求"] }],
        messages: [{ id: "rb-" + Date.now(), roleId: "user", time: nowHM(), tag: "回流", text: reason }],
        scriptedRounds: [], splitRequirements: [{ title: "专项方案修订与回归补丁", priority: "P0", ownerRole: "backend", tasksPreview: ["修订边界", "补回归单测"], checked: true }]
      });
      STATE.selectedIdeaIdByProject[p.id] = iid; STATE.projectTab = "ideas"; STATE.ideaMobilePane = "spec";
      toast("已拉回想法讨论室", "", "warning"); render();
    }

    // Single Source of Truth Verification & Delivery Transitions
    function drillTestFailure() {
      const p = getProj();
      const targetReq = p.requirements.find(r => r.id === STATE.selectedReviewReqId) || p.requirements.find(r => r.stage === "review") || p.requirements[0];
      if (!targetReq) return;
      targetReq.reviewAccepted = false;
      targetReq.stage = "review";
      targetReq.verification = {
        state: "failed", passed: 39, total: 42, lastRunAt: nowHM(), repairAttempt: targetReq.verification?.repairAttempt || 0,
        failingLog: "FAIL test/webhook.test.ts\n  × 拒绝超过 300 秒的重放签名 (ms/sec unit mismatch)\n  × 死信记录幂等重投并发校验 (expected 1, got 2)\n  × 白名单过期自动拒收 (TypeError)"
      };
      STATE.selectedReviewReqId = targetReq.id;
      STATE.workSubTab = "review";
      p.activities.unshift({ time: "刚刚", who: "受保护验证器", text: `${targetReq.code} 验证失败 (39/42)，总览与待处理已同步标红。` });
      toast(`${targetReq.code} 验证失败 (39/42)`, "总览、待我处理与评审页已同步更新，绝无矛盾状态", "error");
      render();
    }

    function triggerAutoRepair(reqId) {
      const p = getProj(), req = p.requirements.find(r => r.id === reqId); if (!req) return;
      req.verification.state = "repairing"; req.verification.repairAttempt++;
      render();
      setTimeout(() => {
        req.verification = { state: "passed", passed: 42, total: 42, lastRunAt: nowHM(), repairAttempt: req.verification.repairAttempt, failingLog: null };
        p.activities.unshift({ time: "刚刚", who: "后端研发", text: `${req.code} 第 ${req.verification.repairAttempt} 轮自动返修完成，复测 42/42 全通过。` });
        toast(`${req.code} 自动返修通过 42/42`, "所有视图已同步恢复待验收状态", "success");
        render();
      }, 950);
    }

    function rerunTests(reqId) {
      const p = getProj(), req = p.requirements.find(r => r.id === reqId); if (!req) return;
      req.verification.state = "verifying"; render();
      setTimeout(() => {
        req.verification = { state: "passed", passed: 42, total: 42, lastRunAt: nowHM(), repairAttempt: req.verification.repairAttempt, failingLog: null };
        toast(`${req.code} 受保护验证通过 42/42`, "", "success"); render();
      }, 700);
    }

    function acceptReq(reqId) {
      const p = getProj(), r = p.requirements.find(x => x.id === reqId);
      if (!r || r.verification?.state !== "passed") return;
      if (r.reviewAccepted) { STATE.projectTab = "release"; render(); return; }
      r.reviewAccepted = true; r.stage = "ready_to_ship"; r.selectedForRelease = true;
      p.tasks.filter(t => t.reqId === reqId && t.status === "review").forEach(t => t.status = "done");
      p.activities.unshift({ time: "刚刚", who: "你", text: `已验收 ${r.code} (${getReqVerifyLabel(r)})，进入待提 PR 池。` });
      toast(`${r.code} 已验收`, "可在「4. 交付发布」提 PR 或打版本 Release", "success");
      render();
    }

    function toggleReleaseReq(rid) { const r = getProj().requirements.find(x => x.id === rid); if (r) { r.selectedForRelease = !r.selectedForRelease; render(); } }

    // Strictly truthful delivery: git_pr -> pr_open ("已提 PR", NOT "已交付上线"!), github_release -> released!
    function executeRelease() {
      const p = getProj(), rel = p.release;
      const picked = p.requirements.filter(r => r.stage === "ready_to_ship" && r.selectedForRelease && r.verification?.state === "passed");
      if (!picked.length) return;
      rel.status = "releasing"; rel.activeReqIds = picked.map(r => r.id);
      rel.ciChecks.forEach(c => c.status = "running");
      render();

      setTimeout(() => { rel.ciChecks[0].status = "pass"; render(); }, 450);
      setTimeout(() => { if (rel.ciChecks[1]) rel.ciChecks[1].status = "pass"; render(); }, 900);
      setTimeout(() => {
        rel.ciChecks.forEach(c => c.status = "pass");
        const codes = picked.map(r => r.code).join(" + ");
        if (rel.kind === "git_pr") {
          rel.status = "pr_open";
          picked.forEach(r => { r.stage = "pr_open"; r.selectedForRelease = false; r.deliveryRef = `PR #${rel.prNumber} · CI 已绿`; });
          rel.history.unshift({ time: "刚刚", kind: "git_pr", state: "已提 PR (未合入)", ref: `PR #${rel.prNumber}`, reqs: codes });
          p.activities.unshift({ time: "刚刚", who: "交付执行器", text: `已为 ${codes} 创建 PR #${rel.prNumber}，CI 已绿待合入 main。` });
          toast(`已创建 PR #${rel.prNumber}`, "需求状态已更新为「已提 PR」（合入 main 前不标记为已上线）", "success");
        } else {
          rel.status = "released";
          picked.forEach(r => { r.stage = "released"; r.selectedForRelease = false; r.deliveryRef = `Release ${rel.releaseTag}`; });
          rel.history.unshift({ time: "刚刚", kind: "github_release", state: "已发布 Release", ref: rel.releaseTag, reqs: codes });
          p.activities.unshift({ time: "刚刚", who: "交付执行器", text: `已发布版本 ${rel.releaseTag} (${codes}) 并核验资产摘要。` });
          toast(`已发布 ${rel.releaseTag}`, "资产摘要校验通过", "success");
        }
        render();
      }, 1350);
    }

    function confirmPrMerged() {
      const p = getProj(), rel = p.release;
      const openReqs = p.requirements.filter(r => r.stage === "pr_open");
      const codes = openReqs.map(r => r.code).join(" + ");
      openReqs.forEach(r => { r.stage = "merged"; r.deliveryRef = `PR #${rel.prNumber} · 已合入 main`; });
      rel.status = "merged";
      rel.history.unshift({ time: "刚刚", kind: "git_pr", state: "已合并 main", ref: `PR #${rel.prNumber}`, reqs: codes || "--" });
      p.activities.unshift({ time: "刚刚", who: "Git Remote", text: `PR #${rel.prNumber} 已正式合入 main (${codes})。` });
      toast(`PR #${rel.prNumber} 已合入 main`, "对应需求已诚实推进至「已合并 main」", "success");
      render();
    }

    function rollbackRelease() {
      const p = getProj(), rel = p.release;
      const affected = p.requirements.filter(r => r.stage === "pr_open");
      affected.forEach(r => { r.stage = "ready_to_ship"; r.deliveryRef = null; r.selectedForRelease = true; });
      rel.status = "rolled_back";
      rel.history.unshift({ time: "刚刚", kind: rel.kind, state: "已回滚关闭", ref: `PR #${rel.prNumber}`, reqs: affected.map(r => r.code).join(" + ") || "--" });
      toast("已撤回并关闭 PR", "相关需求已退回待交付池", "error");
      render();
    }

    function drillGitConflict() { getProj().conflictNotice = "并行分支合并冲突已自动在隔离 Worktree 解决并复测通过。"; STATE.projectTab = "progress"; render(); }
    function drillNodeFailover() { const p = getProj(), mac = getMachine("m-mac"), t = p.tasks.find(x => x.status === "running") || p.tasks[0]; if (mac) { mac.status = "offline"; mac.cpu = 0; } if (t) { t.machineId = "m-lin"; t.closureState = "已由 Ubuntu-Runner-03 接管"; } p.failoverNotice = "MacBook-Pro-M4 离线，运行中任务已自动转移至 Ubuntu-Runner-03 续跑。"; STATE.projectTab = "progress"; render(); }
    function resolveBlocker(tid, idx) { const p = getProj(), t = p.tasks.find(x => x.id === tid); if (!t || !t.blocker) return; const chosen = t.blocker.options[idx]; t.blocker = null; t.status = "done"; t.progress = 100; t.closureState = "已闭合"; t.logs.push(`[${nowHM()}] 负责人拍板：${chosen}`); p.activities.unshift({ time: "刚刚", who: "你", text: `拍板解除阻塞：${chosen}` }); closeDrawer(); toast("阻塞已解除", "", "success"); render(); }
    function appendLog(tid) { const t = getProj().tasks.find(x => x.id === tid); if (t) { t.progress = Math.min(96, t.progress + 10); t.logs.push(`[${nowHM()}] passed 22/24 tests...`); render(); } }
    function stopTask(tid) { const t = getProj().tasks.find(x => x.id === tid); if (!t) return; t.closureState = "等待 OS 进程树确认退出..."; renderDrawer(); setTimeout(() => { t.status = "stopped"; t.closureState = "已确认 0 残留子进程 · 槽位释放"; toast("已安全停止", "", "warning"); render(); }, 650); }
    function retryTask(tid) { const t = getProj().tasks.find(x => x.id === tid); if (t) { t.status = "running"; t.progress = 30; t.closureState = "运行中 · 新授权"; render(); } }
    function switchMachine(tid, mid) { const t = getProj().tasks.find(x => x.id === tid); if (t) { t.machineId = mid; render(); } }
    function toggleNode(id) { const m = getMachine(id); if (m) { m.status = m.status === "online" ? "offline" : "online"; render(); } }
    function reverify(mid, cid) { const c = getMachine(mid)?.clis.find(x => x.id === cid); if (c) { c.status = "ready"; c.fixHint = ""; toast("验证通过", "", "success"); render(); } }
    function addNode() { STATE.machines.push({ id: "m-" + Date.now(), name: STATE.connectOs + "-Node-04", os: STATE.connectOs, service: "常驻服务", status: "online", cpu: 12, mem: 21, slots: "0/4", prProjects: ["p-pay"], verifiers: ["node-vitest-lint"], clis: [{ id: "codex", name: "Codex CLI", ver: "0.42.0", tier: "Tier 2 读写", status: "ready", fixHint: "" }] }); closeModal(); toast("新电脑已上线", "", "success"); render(); }

    function createNewIdea() {
      const p = getProj(), title = document.getElementById("ni-title").value.trim() || "新想法", desc = document.getElementById("ni-desc").value.trim() || "请讨论拆分需求。";
      const iid = "idea-" + Date.now();
      p.ideas.unshift({
        id: iid, title, status: "discussing", mode: "auto", round: 1, maxRounds: 6, isTyping: false, typingRole: null, inputDraft: "", scriptIdx: 0, proposalSummary: desc,
        disagreements: [{ id: "dn-" + Date.now(), question: "汇率是否锁定下单时刻快照，还是按结算日实时汇率？", positions: "后端建议下单快照防金额漂移；财务视角需确认。", resolved: false, options: ["锁定下单时刻汇率快照（推荐）", "按结算日实时汇率折算"] }],
        messages: [{ id: "m1", roleId: "user", time: nowHM(), tag: "想法", text: desc }, { id: "m2", roleId: "architect", time: nowHM(), tag: "拆解", text: "收到！建议先拆成核心引擎与展示 UI 两个独立需求。" }],
        scriptedRounds: [[{ roleId: "qa", tag: "同意", text: "精度与汇率边界单测已对齐，无未决分歧。" }]],
        splitRequirements: [
          { title: "多币种汇率定时同步与快照引擎", priority: "P0", ownerRole: "backend", tasksPreview: ["汇率缓存", "精度单测"], checked: true },
          { title: "多币种结算账单展示 UI", priority: "P1", ownerRole: "frontend", tasksPreview: ["币种格式化", "报表导出"], checked: true }
        ]
      });
      STATE.selectedIdeaIdByProject[p.id] = iid; STATE.projectTab = "ideas"; STATE.ideaMobilePane = "spec"; closeModal(); render();
    }

    function createNewProject() {
      const name = document.getElementById("np-name").value.trim() || "新项目", repo = document.getElementById("np-repo").value.trim() || "acme/new-repo", ideaTxt = document.getElementById("np-idea").value.trim() || "讨论 MVP";
      const pid = "p-" + Date.now(), iid = "idea-" + Date.now();
      STATE.projects.unshift({
        id: pid, name, repo, defaultBranch: "main", defaultVerifier: "node-vitest-lint", maxAutoRepairs: 3, failoverNotice: null, conflictNotice: null,
        ideas: [{
          id: iid, title: `${name} MVP 初始想法`, status: "discussing", mode: "auto", round: 1, maxRounds: 6, isTyping: false, typingRole: null, inputDraft: "", scriptIdx: 0, proposalSummary: ideaTxt,
          disagreements: [{ id: "dp-" + Date.now(), question: "首版先支持 PDF 单格式，还是同时支持 Notion 同步？", positions: "建议先做 PDF 尽快上线验证。", resolved: false, options: ["首版仅做 PDF，Notion 放二期（推荐）", "PDF 与 Notion 同步首版全做"] }],
          messages: [{ id: "pm1", roleId: "user", time: nowHM(), tag: "想法", text: ideaTxt }],
          scriptedRounds: [[{ roleId: "qa", tag: "同意", text: "MVP 验收标准已对齐。" }]],
          splitRequirements: [
            { title: "文档解析与向量检索 API", priority: "P0", ownerRole: "backend", tasksPreview: ["解析管线", "检索单测"], checked: true },
            { title: "客服问答工作台 UI", priority: "P1", ownerRole: "frontend", tasksPreview: ["对话页", "来源高亮"], checked: true }
          ]
        }],
        requirements: [], tasks: [], diffs: { "README.md": [{ t: "h", text: "@@ 初始化 @@" }] },
        release: { kind: "git_pr", status: "idle", prNumber: 1, prUrl: `https://github.com/${repo}/pull/1`, releaseTag: "v0.1.0", activeReqIds: [], ciChecks: [{ name: "CI Build", status: "pending" }], history: [] },
        activities: [{ time: "刚刚", who: "你", text: `创建了项目「${name}」（待连接专属团队成员）。` }]
      });
      STATE.selectedProjectId = pid; STATE.selectedIdeaIdByProject[pid] = iid; STATE.screen = "project"; STATE.projectTab = "ideas"; closeModal();
      toast(`项目「${name}」已创建`, "请先连接本项目专属的 Agent 实例", "success"); render();
    }

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openModal("cmd"); return; }
      if (e.key === "Escape") { STATE.mobileNavOpen = false; closeModal(); closeDrawer(); render(); return; }
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
      if (STATE.screen === "project" && !STATE.modal && !STATE.drawer) {
        if (e.key === "1") { STATE.projectTab = "ideas"; render(); }
        else if (e.key === "2") { STATE.projectTab = "progress"; render(); }
        else if (e.key === "3") { STATE.projectTab = "work"; render(); }
        else if (e.key === "4") { STATE.projectTab = "release"; render(); }
        else if (e.key.toLowerCase() === "t") { setTheme(CURRENT_THEME === "dark" ? "light" : "dark"); }
      }
    });

    render();
  </script>
</body>
</html>
